<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử nộp bài · CyberLabX</title>
  <link rel="stylesheet" href="assets/vendor/fonts.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/skin-quest.css">
  <script src="assets/theme.js"></script>
  <style>
    /* Riêng trang Lịch sử nộp bài */
    .history-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .history-toolbar .search {
      flex: 1;
      min-width: 240px;
    }
    .history-toolbar .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Bảng sổ cái: cột ID căn lề trái trước vạch kẻ sổ cái */
    .history-tbl {
      --cols: 72px 190px minmax(0, 2fr) minmax(0, 1.3fr) 90px 100px;
    }
    .history-tbl.ledger .tbl-row::before {
      left: 92px;
    }
    .history-tbl .no {
      font-size: 12px;
      padding-right: 0;
      text-align: center;
    }
    .history-tbl .col-time {
      font-size: 12.5px;
    }

    /* Chú giải mã kết quả gọn: một hàng chữ nhỏ */
    .verdict-legend-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--text-3);
    }
    .verdict-legend-row .legend-title {
      font-weight: 500;
      color: var(--text-2);
    }
    .verdict-legend-row .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .col-mobile-sub {
      display: none;
    }

    @media (max-width: 860px) {
      .history-tbl {
        --cols: 64px 130px minmax(0, 1fr) 56px 72px;
      }
      .col-course {
        display: none;
      }
    }
    @media (max-width: 640px) {
      .history-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .history-toolbar .search {
        min-width: 100%;
      }
      .history-toolbar .filters {
        width: 100%;
      }
      .history-toolbar .filters .select {
        flex: 1;
      }
    }
    @media (max-width: 560px) {
      .history-tbl {
        --cols: 48px minmax(0, 1fr) 64px;
        font-size: 13px;
      }
      .history-tbl .tbl-row {
        padding: 10px 14px;
        min-height: 48px;
        gap: 12px;
      }
      .history-tbl.ledger .tbl-row::before {
        left: 68px;
      }
      .history-tbl .tbl-head {
        display: none;
      }
      .col-time, .col-course, .col-score {
        display: none;
      }
      .col-mobile-sub {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        color: var(--text-3);
        margin-top: 2px;
      }
      .verdict-legend-row {
        gap: 10px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body data-page="history" data-title="Lịch sử nộp bài">
  <main class="content" id="content">
    <div class="stack">
      <section>
        <div class="section-head">
          <h2>Nhật ký bài nộp</h2>
          <span class="meta tnum" id="history-count">Đang tải…</span>
        </div>

        <div class="history-toolbar">
          <div class="search">
            <i data-lucide="search"></i>
            <input type="search" class="input" id="search-input" placeholder="Tìm theo tên bài hoặc mã ID" aria-label="Tìm theo tên bài hoặc mã ID">
          </div>
          <div class="filters">
            <select class="select" id="filter-course" aria-label="Lọc theo môn học" style="width:auto">
              <option value="">Tất cả môn học</option>
            </select>
            <select class="select" id="filter-verdict" aria-label="Lọc theo kết quả" style="width:auto">
              <option value="">Tất cả kết quả</option>
              <option value="AC">AC · Kết quả đúng</option>
              <option value="WA">WA · Kết quả sai</option>
              <option value="WF">WF · Sai định dạng</option>
              <option value="WFN">WFN · Sai tên tệp</option>
              <option value="CPY">CPY · Sao chép</option>
            </select>
          </div>
        </div>

        <div class="card" id="table-card">
          <div class="tbl ledger history-tbl" role="table" aria-label="Nhật ký bài nộp">
            <div role="rowgroup">
              <div class="tbl-row tbl-head" role="row">
                <span role="columnheader" class="no col-id">ID</span>
                <span role="columnheader" class="col-time">Thời gian</span>
                <span role="columnheader">Bài tập</span>
                <span role="columnheader" class="col-course">Môn học</span>
                <span role="columnheader" class="col-score num">Điểm</span>
                <span role="columnheader" class="num">Kết quả</span>
              </div>
            </div>
            <div id="table-body" role="rowgroup"></div>
          </div>
          <div class="pager-host" id="pager"></div>
        </div>

        <!-- Chú giải mã kết quả gọn: một hàng chữ nhỏ, không cả khối -->
        <div class="verdict-legend-row" aria-label="Chú giải mã kết quả">
          <span class="legend-title">Chú giải:</span>
          <span class="legend-item"><span class="verdict v-AC">AC</span> Kết quả đúng</span>
          <span class="legend-item"><span class="verdict v-WA">WA</span> Kết quả sai</span>
          <span class="legend-item"><span class="verdict v-WF">WF</span> Sai định dạng</span>
          <span class="legend-item"><span class="verdict v-WFN">WFN</span> Sai tên tệp</span>
          <span class="legend-item"><span class="verdict v-CPY">CPY</span> Sao chép</span>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var D = window.CLX;
      var U = window.CLXUI;
      var esc = U.esc;
      var rawHistory = D.history || [];
      var searchQ = '';
      var curCourse = '';
      var curVerdict = '';

      // Khởi tạo danh sách môn học cho bộ lọc
      var courseSelect = document.getElementById('filter-course');
      var courses = [];
      rawHistory.forEach(function (h) {
        if (h.course && courses.indexOf(h.course) === -1) {
          courses.push(h.course);
        }
      });
      courses.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        courseSelect.appendChild(opt);
      });

      var state = { rows: rawHistory, page: 1, size: 20 };
      var pg = CLXUI.pager(document.getElementById('pager'), {
        total: state.rows.length,
        page: 1,
        size: 20,
        sizes: [10, 20, 40],
        onChange: function (page, size) {
          state.page = page;
          state.size = size;
          draw();
        }
      });

      function applyFilters() {
        return rawHistory.filter(function (item) {
          if (curCourse && item.course !== curCourse) return false;
          if (curVerdict && item.status !== curVerdict) return false;
          if (searchQ) {
            var q = searchQ.toLowerCase();
            var mTitle = item.title && item.title.toLowerCase().indexOf(q) !== -1;
            var mId = String(item.id).indexOf(q) !== -1;
            var mCourse = item.course && item.course.toLowerCase().indexOf(q) !== -1;
            if (!mTitle && !mId && !mCourse) return false;
          }
          return true;
        });
      }

      function onFilterChange() {
        state.rows = applyFilters();
        state.page = 1;
        pg.set({ total: state.rows.length, page: 1 });
        draw();
      }

      function draw() {
        var total = state.rows.length;

        // Cập nhật số lượng
        var countEl = document.getElementById('history-count');
        if (total === rawHistory.length) {
          countEl.textContent = total + ' lượt nộp';
        } else {
          countEl.textContent = 'Khớp ' + total + ' / ' + rawHistory.length + ' lượt nộp';
        }

        var tableBody = document.getElementById('table-body');

        // Trạng thái rỗng khi lọc ra 0 kết quả
        if (total === 0) {
          tableBody.innerHTML = '<div class="empty">' +
            '<div>Không tìm thấy lượt nộp nào phù hợp với bộ lọc.</div>' +
            '<div class="faint" style="font-size:13px;margin-top:4px">Thử đổi từ khóa hoặc xóa bộ lọc để xem lại danh sách.</div>' +
            '<div style="margin-top:14px">' +
              '<button type="button" class="btn btn-sm" id="btn-clear-filters">' +
                '<i data-lucide="rotate-ccw"></i>' +
                '<span>Xóa bộ lọc</span>' +
              '</button>' +
            '</div>' +
          '</div>';

          var clearBtn = document.getElementById('btn-clear-filters');
          if (clearBtn) {
            clearBtn.addEventListener('click', function () {
              searchQ = '';
              curCourse = '';
              curVerdict = '';
              document.getElementById('search-input').value = '';
              document.getElementById('filter-course').value = '';
              document.getElementById('filter-verdict').value = '';
              onFilterChange();
            });
          }
          window.clxIcons();
          return;
        }

        var slice = CLXUI.paginate(state.rows, state.page, state.size);
        tableBody.innerHTML = slice.map(function (row) {
          return '<div class="tbl-row" role="row">' +
            '<span class="no col-id tnum" role="cell">' + esc(row.id) + '</span>' +
            '<span class="mono faint tnum col-time" role="cell">' + esc(row.time) + '</span>' +
            '<div class="col-main trunc" role="cell">' +
              '<a class="link trunc" style="color:var(--text);font-weight:500;display:block" href="assignments.html">' + esc(row.title) + '</a>' +
              '<div class="col-mobile-sub">' +
                '<span class="trunc">' + esc(row.course) + '</span>' +
                '<span>·</span>' +
                '<span class="mono tnum">' + esc(row.time.slice(5)) + '</span>' +
                '<span>·</span>' +
                '<span class="mono tnum">' + esc(row.score || '—') + '</span>' +
              '</div>' +
            '</div>' +
            '<span class="dim trunc col-course" role="cell">' + esc(row.course) + '</span>' +
            '<span class="mono faint tnum col-score num" role="cell">' + esc(row.score || '—') + '</span>' +
            '<span class="num" role="cell">' + U.verdict(row.status) + '</span>' +
          '</div>';
        }).join('');

        window.clxIcons();
      }

      // Lắng nghe sự kiện tìm kiếm & lọc
      document.getElementById('search-input').addEventListener('input', function (e) {
        searchQ = e.target.value.trim();
        onFilterChange();
      });

      document.getElementById('filter-course').addEventListener('change', function (e) {
        curCourse = e.target.value;
        onFilterChange();
      });

      document.getElementById('filter-verdict').addEventListener('change', function (e) {
        curVerdict = e.target.value;
        onFilterChange();
      });

      draw();
    })();
  </script>
</body>
</html>
