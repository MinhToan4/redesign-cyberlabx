<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập · CyberLabX</title>
  <link rel="stylesheet" href="assets/vendor/fonts.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/skin-quest.css">
  <script src="assets/theme.js"></script>
  <style>
    /* Bổ trợ riêng cho trang Bài tập */
    body {
      overflow-x: hidden;
    }
    .content,
    #view-container {
      min-width: 0;
      max-width: 100%;
    }
    b, strong {
      font-weight: 500;
    }

    /* Tabs cuộn ngang mượt mà trên mobile */
    .tabs {
      display: flex;
      max-width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Lưới lớp học phần */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    @media (max-width: 640px) {
      .class-grid {
        grid-template-columns: 1fr;
      }
    }

    .class-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .class-card:hover {
      background: var(--surface-2);
    }
    .class-ticks .ticks {
      max-width: none;
      width: 100%;
    }

    /* Thông số kiểm thử & rubric */
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
      border-radius: var(--r-card);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .metric-item .m-label {
      font-size: 12px;
      color: var(--text-3);
    }
    .metric-item .m-val {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      margin-top: 4px;
    }

    /* Cột số lượt nộp */
    .attempts {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Timeline các bước thực hiện */
    .step-item {
      display: flex;
      gap: 16px;
      position: relative;
    }
    .step-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: none;
      width: 24px;
    }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: var(--r-control);
      display: grid;
      place-items: center;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      font: 500 11.5px var(--mono);
      color: var(--text-2);
    }
    .step-num.is-done {
      background: var(--ok-soft);
      border-color: color-mix(in srgb, var(--ok) 40%, transparent);
      color: var(--ok);
    }
    .step-line {
      flex: 1;
      width: 1px;
      background: var(--line);
      margin: 6px 0;
      min-height: 24px;
    }
    .step-body {
      padding-bottom: 20px;
      min-width: 0;
      flex: 1;
    }
    .step-title {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text);
    }
    .step-desc {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }

    /* Vùng thả tệp */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--r-card);
      background: var(--surface-2);
      cursor: pointer;
      text-align: center;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      color: inherit;
    }
    .dropzone:hover,
    .dropzone.is-dragover {
      background: var(--mute-soft);
      border-color: var(--accent);
    }
    .dropzone:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Bình luận đa cấp */
    .comment-card {
      padding: 16px;
      border-radius: var(--r-card);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .comment-card + .comment-card {
      margin-top: 12px;
    }
    .comment-reply {
      margin-left: 20px;
      margin-top: 12px;
      padding-left: 12px;
      border-left: 2px solid var(--line);
    }

    /* Thẻ bài tập dạng lưới */
    .lab-grid-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .lab-grid-card:hover {
      background: var(--surface-2);
    }

    .mobile-sub {
      display: none;
    }

    /* Bảng danh sách bài của lớp */
    .tbl-class-assign {
      --cols: 56px 190px minmax(0, 2fr) 150px minmax(0, 1fr) 96px 110px;
    }

    /* Bảng sổ cái lịch sử nộp bài */
    .tbl-ledger-hist {
      --cols: 52px 76px 140px minmax(0, 1fr) 76px 84px;
    }

    @media (max-width: 960px) {
      .tbl-class-assign {
        --cols: 44px 120px minmax(0, 1fr) 100px 84px;
      }
      .tbl-class-assign .col-topic,
      .tbl-class-assign .col-diff {
        display: none;
      }
      .metric-strip {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .tbl-class-assign {
        --cols: minmax(0, 1fr) auto !important;
      }
      .tbl-class-assign .tbl-head {
        display: none !important;
      }
      .tbl-class-assign .tbl-row:not(.tbl-head) {
        padding: 12px 16px;
        min-height: unset;
        gap: 12px;
      }
      .tbl-class-assign .col-stt,
      .tbl-class-assign .col-code,
      .tbl-class-assign .col-attempts,
      .tbl-class-assign .col-topic,
      .tbl-class-assign .col-diff {
        display: none !important;
      }
      .mobile-sub {
        display: flex !important;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--text-3);
        margin-top: 4px;
      }

      /* Ledger trên mobile */
      .tbl-ledger-hist {
        --cols: minmax(0, 1fr) auto !important;
      }
      .tbl-ledger-hist .tbl-head {
        display: none !important;
      }
      .tbl-ledger-hist .tbl-row {
        padding: 12px 16px;
        min-height: unset;
        gap: 12px;
      }
      .tbl-ledger-hist.ledger .tbl-row::before {
        display: none !important;
      }
      .tbl-ledger-hist .no,
      .tbl-ledger-hist .col-id,
      .tbl-ledger-hist .col-time {
        display: none !important;
      }
      .ledger-mobile-meta {
        display: flex !important;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .ledger-mobile-sub {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-3);
      }

      .metric-strip {
        grid-template-columns: 1fr;
      }
      .stat-strip-4 {
        grid-template-columns: 1fr 1fr !important;
      }
      .comment-reply {
        margin-left: 12px;
      }
    }
  </style>
</head>
<body data-page="assignments" data-title="Bài tập">
  <main class="content" id="content">
    <div id="view-container"></div>
  </main>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var D = window.CLX;
      var U = window.CLXUI;
      var esc = U.esc;
      var ticks = U.ticks;
      var verdict = U.verdict;
      var paginate = U.paginate;
      var pager = U.pager;
      var container = document.getElementById('view-container');

      // Đọc tham số URL
      function getParams() {
        var p = new URLSearchParams(window.location.search);
        return {
          classCode: p.get('class') || '',
          code: p.get('code') || '',
          tab: p.get('tab') || '',
          page: parseInt(p.get('p') || p.get('page'), 10) || 1,
          size: parseInt(p.get('size'), 10) || 20
        };
      }

      var initParams = getParams();

      // State lưu trữ cục bộ
      var state = {
        assignView: 'table', // 'table' | 'grid'
        activeTab: 'class',  // 'class' | 'map'
        search: '',
        fGroup: '',
        fDiff: '',
        fTopic: '',
        fStatus: '',
        page: initParams.page,
        pageSize: initParams.size,
        mapSearch: '',
        mapStage: 'all',
        mapStatus: 'all',
        pickedFile: null,
        submitResult: null,
        commentText: '',
        replyParentId: null,
        currentCode: null,
        comments: (function () {
          return (D.baseComments || []).map(function (c) {
            var cp = Object.assign({}, c);
            if (!cp.assignmentCode) cp.assignmentCode = 'nmap-discovery';
            if (!cp.classCode) cp.classCode = 'INT1449.01';
            return cp;
          });
        })(),
        extraHistory: [],
        histPage: 1,
        histPageSize: 5,
        assignmentOverrides: {}
      };

      // Cập nhật tiêu đề Topbar và Document
      function setPageHeader(title, crumb) {
        document.title = (crumb ? title + ' · ' + crumb : title) + ' · CyberLabX';
        var titleEl = document.querySelector('.topbar .page-title');
        if (titleEl) {
          titleEl.innerHTML = (crumb ? '<span class="crumb">' + esc(crumb) + ' / </span>' : '') + esc(title);
        }
      }

      // Lấy thời gian hiện tại từ đồng hồ thực dạng YYYY-MM-DD HH:mm
      function getNowFormatted() {
        var now = new Date();
        var pad = function (n) { return n < 10 ? '0' + n : String(n); };
        return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      }

      // Lấy số lượt nộp đã dùng và tối đa từ chuỗi 'used/max'
      function getAssignmentAttempts(assignment) {
        var used = 0;
        var max = 4;
        if (assignment && assignment.attempts && typeof assignment.attempts === 'string' && assignment.attempts.indexOf('/') !== -1) {
          var parts = assignment.attempts.split('/');
          used = parseInt(parts[0], 10) || 0;
          max = parseInt(parts[1], 10) || 4;
        }
        return { used: used, max: max };
      }

      // Cập nhật trạng thái và số lượt nộp của bài tập vào state và dữ liệu dùng chung (Item 2 & 4)
      function updateAssignmentState(code, newStatus, newAttemptsStr) {
        if (!code) return;
        if (!state.assignmentOverrides) state.assignmentOverrides = {};
        state.assignmentOverrides[code] = {
          status: newStatus,
          attempts: newAttemptsStr
        };

        // Cập nhật danh sách bài tập của mọi lớp trong bộ nhớ
        if (D.classes) {
          for (var c = 0; c < D.classes.length; c++) {
            if (D.classes[c].assignments) {
              for (var a = 0; a < D.classes[c].assignments.length; a++) {
                if (D.classes[c].assignments[a].code === code) {
                  if (newStatus) D.classes[c].assignments[a].status = newStatus;
                  if (newAttemptsStr) D.classes[c].assignments[a].attempts = newAttemptsStr;
                }
              }
            }
          }
        }

        // Cập nhật D.assignmentDetails
        if (D.assignmentDetails && D.assignmentDetails[code]) {
          if (newStatus) D.assignmentDetails[code].status = newStatus;
          if (newAttemptsStr) D.assignmentDetails[code].attempts = newAttemptsStr;
        }

        // Cập nhật D.dueAssignments
        if (D.dueAssignments) {
          for (var d = 0; d < D.dueAssignments.length; d++) {
            if (D.dueAssignments[d].code === code) {
              if (newStatus) D.dueAssignments[d].status = newStatus;
              if (newAttemptsStr) D.dueAssignments[d].attempts = newAttemptsStr;
            }
          }
        }

        // Cập nhật D.publicLabMapStages
        if (D.publicLabMapStages) {
          for (var s = 0; s < D.publicLabMapStages.length; s++) {
            if (D.publicLabMapStages[s].labs) {
              for (var l = 0; l < D.publicLabMapStages[s].labs.length; l++) {
                if (D.publicLabMapStages[s].labs[l].code === code) {
                  if (newStatus === 'AC') D.publicLabMapStages[s].labs[l].status = 'completed';
                  else if (newStatus) D.publicLabMapStages[s].labs[l].status = 'in_progress';
                }
              }
            }
          }
        }
      }

      // Render vạch số lượt nộp đã dùng / tối đa
      function renderAttemptsTicks(attemptsStr) {
        if (!attemptsStr || typeof attemptsStr !== 'string' || attemptsStr.indexOf('/') === -1) {
          return '<span class="faint" style="font-size:12px">Chưa nộp</span>';
        }
        var parts = attemptsStr.split('/');
        var used = parseInt(parts[0], 10) || 0;
        var max = parseInt(parts[1], 10) || 1;
        var isExhausted = used >= max;
        return '<div class="attempts">' +
          ticks(max, used, isExhausted ? 'is-error' : '') +
          '<span class="mono tnum faint" style="font-size:11.5px">' + esc(attemptsStr) + '</span>' +
          '</div>';
      }

      // Tìm thông tin lớp
      function findClass(classCode) {
        if (!classCode) return null;
        var q = classCode.toLowerCase();
        for (var i = 0; i < D.classes.length; i++) {
          var c = D.classes[i];
          if (c.code.toLowerCase() === q || c.course.toLowerCase() === q || c.code.toLowerCase().startsWith(q)) {
            return c;
          }
        }
        return D.classes[0];
      }

      // Tìm thông tin bài tập
      function findAssignment(code, classObj) {
        if (!code) return null;
        var detail = (D.assignmentDetails && D.assignmentDetails[code]) || null;
        var base = null;

        // Tìm trong các lớp
        if (classObj && classObj.assignments) {
          for (var i = 0; i < classObj.assignments.length; i++) {
            if (classObj.assignments[i].code === code) {
              base = classObj.assignments[i];
              break;
            }
          }
        }
        if (!base) {
          for (var c = 0; c < D.classes.length; c++) {
            for (var a = 0; a < D.classes[c].assignments.length; a++) {
              if (D.classes[c].assignments[a].code === code) {
                base = D.classes[c].assignments[a];
                if (!classObj) classObj = D.classes[c];
                break;
              }
            }
            if (base) break;
          }
        }

        // Tìm trong publicLabMapStages
        var mapStageName = '';
        if (D.publicLabMapStages) {
          for (var s = 0; s < D.publicLabMapStages.length; s++) {
            var st = D.publicLabMapStages[s];
            for (var l = 0; l < st.labs.length; l++) {
              if (st.labs[l].code === code) {
                if (!base) {
                  base = {
                    code: st.labs[l].code,
                    title: st.labs[l].title,
                    group: st.labs[l].skill || 'An toàn thông tin',
                    topic: st.labs[l].skill || 'Thực hành',
                    diff: st.labs[l].diff === 'Mức 3' ? 3 : st.labs[l].diff === 'Mức 2' ? 2 : 1,
                    xp: st.labs[l].points || 50,
                    solved: Math.round(st.labs[l].solveRate * 0.4) || 25,
                    status: st.labs[l].status === 'completed' ? 'AC' : st.labs[l].status === 'in_progress' ? 'WA' : null,
                    deadline: '2026-10-30 23:59'
                  };
                }
                mapStageName = st.title;
                break;
              }
            }
            if (mapStageName) break;
          }
        }

        if (!base && !detail) {
          return null;
        }

        var res = Object.assign({}, base || {}, detail || {});
        if (classObj) {
          res.courseName = res.courseName || classObj.name;
          res.classCode = res.classCode || classObj.code;
          res.group = res.group || classObj.group;
        } else if (mapStageName) {
          res.courseName = res.courseName || mapStageName;
          res.classCode = res.classCode || 'PUBLIC-MAP';
        }
        if (state.assignmentOverrides && state.assignmentOverrides[code]) {
          Object.assign(res, state.assignmentOverrides[code]);
        }
        return res;
      }

      // Điều hướng nội bộ không tải lại trang
      function navigate(url) {
        window.history.pushState(null, '', url);
        var p = getParams();
        state.search = '';
        state.fGroup = '';
        state.fDiff = '';
        state.fTopic = '';
        state.fStatus = '';
        state.page = p.page || 1;
        state.pageSize = p.size || 20;
        state.pickedFile = null;
        state.submitResult = null;
        state.replyParentId = null;
        state.histPage = 1;
        window.scrollTo(0, 0);
        render();
      }

      // ==========================================
      // VIEW 1: TỔNG QUAN (Lớp học phần + Bản đồ)
      // ==========================================
      function renderOverview(tabParam) {
        if (tabParam === 'map') state.activeTab = 'map';
        else if (tabParam === 'class') state.activeTab = 'class';

        setPageHeader('Bài tập', '');

        var html = '';

        // Tab bar
        html += '<div class="tabs" role="tablist" style="margin-bottom:24px">';
        html += '<button role="tab" id="tab-classes-btn"' + (state.activeTab === 'class' ? ' aria-selected="true"' : ' aria-selected="false"') + '><i data-lucide="graduation-cap"></i>Bài tập theo lớp học phần</button>';
        html += '<button role="tab" id="tab-map-btn"' + (state.activeTab === 'map' ? ' aria-selected="true"' : ' aria-selected="false"') + '><i data-lucide="radar"></i>Bản đồ bài tập công khai</button>';
        html += '</div>';

        if (state.activeTab === 'class') {
          // Tab 1: Danh sách các lớp học phần
          html += '<section>';
          html += '<div class="section-head"><h2>Lớp học phần</h2><span class="meta tnum">' + D.classes.length + ' lớp đang mở</span></div>';
          html += '<div class="class-grid">';

          D.classes.forEach(function (c) {
            var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
            var doneTicks = Math.round((c.done / c.total) * 20);

            html += '<div class="card card-pad class-card">';
            html += '<div>';
            html += '<div class="row-between" style="margin-bottom:12px">';
            html += '<div class="row-gap"><span class="chip chip-mono">' + esc(c.code) + '</span><span class="faint" style="font-size:12.5px">' + esc(c.group) + '</span></div>';
            html += '<span class="chip" style="font-size:11.5px">' + c.credits + ' tín chỉ</span>';
            html += '</div>';
            html += '<h2 style="font-size:16px;margin:8px 0;line-height:1.4">' + esc(c.name) + '</h2>';
            html += '<div class="faint" style="font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:16px">';
            html += '<i data-lucide="user-round"></i><span>GV: <b style="color:var(--text);font-weight:500">' + esc(c.teacher) + '</b></span>';
            html += '</div>';
            html += '</div>';

            html += '<div>';
            html += '<div style="margin-bottom:16px">';
            html += '<div class="row-between" style="font-size:12.5px;margin-bottom:6px;gap:8px">';
            html += '<span class="dim">Tiến độ bài tập:</span>';
            html += '<span class="mono tnum dim" style="flex-shrink:0;white-space:nowrap">' + c.done + '/' + c.total + ' bài (' + pct + '%)</span>';
            html += '</div>';
            html += '<div class="class-ticks">' + ticks(20, doneTicks) + '</div>';
            html += '</div>';

            html += '<a class="btn class-enter-btn" href="assignments.html?class=' + encodeURIComponent(c.code) + '" data-class="' + esc(c.code) + '" style="width:100%"><i data-lucide="flask-conical"></i>Vào lớp học phần<i data-lucide="arrow-right"></i></a>';
            html += '</div>';
            html += '</div>';
          });

          html += '</div>';
          html += '</section>';

          container.innerHTML = html;

          // Bắt sự kiện Vào lớp học phần (SPA click)
          document.querySelectorAll('.class-enter-btn').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              navigate(btn.getAttribute('href'));
            });
          });

        } else {
          // Tab 2: Bản đồ bài tập công khai
          var stages = D.publicLabMapStages || [];
          var allLabs = [];
          stages.forEach(function (s) { allLabs = allLabs.concat(s.labs || []); });

          var totalLabs = allLabs.length;
          var solvedLabs = allLabs.filter(function (l) { return l.status === 'completed'; }).length;
          var inProgressLabs = allLabs.filter(function (l) { return l.status === 'in_progress'; }).length;
          var totalXp = allLabs.reduce(function (sum, l) { return sum + (l.points || 0); }, 0);
          var earnedXp = allLabs.filter(function (l) { return l.status === 'completed'; }).reduce(function (sum, l) { return sum + (l.points || 0); }, 0);
          var overallPct = totalLabs ? Math.round((solvedLabs / totalLabs) * 100) : 0;

          // Thẻ chỉ số tổng quan
          html += '<section class="card stat-strip stat-strip-4" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px" aria-label="Chỉ số lộ trình">';
          html += '<div class="stat"><div class="label">Tiến độ toàn bản đồ</div><div class="value mono">' + solvedLabs + '/' + totalLabs + '</div><div class="hint">' + overallPct + '% hoàn thành</div></div>';
          html += '<div class="stat"><div class="label">Điểm XP đã đạt</div><div class="value mono">' + earnedXp.toLocaleString('en-US') + '</div><div class="hint">trên ' + totalXp.toLocaleString('en-US') + ' XP</div></div>';
          html += '<div class="stat"><div class="label">Đang thực hành dở</div><div class="value mono">' + inProgressLabs + '</div><div class="hint">bài lab chưa nộp đủ</div></div>';
          html += '<div class="stat"><div class="label">Chặng lộ trình</div><div class="value mono">' + stages.length + '</div><div class="hint">Cơ bản → Nâng cao</div></div>';
          html += '</section>';

          // Toolbar tìm kiếm & lọc chặng
          html += '<div class="toolbar" style="margin-bottom:20px">';
          html += '<div class="search" style="flex:1;min-width:240px"><i data-lucide="search"></i><input class="input" id="map-search-input" placeholder="Tìm theo tên bài, mã bài hoặc kỹ năng" value="' + esc(state.mapSearch) + '" aria-label="Tìm kiếm lộ trình"></div>';
          html += '<select class="select" id="map-stage-select" style="width:auto" aria-label="Chọn chặng">';
          html += '<option value="all">Tất cả các chặng (' + stages.length + ')</option>';
          stages.forEach(function (s) {
            html += '<option value="' + esc(s.id) + '"' + (state.mapStage === s.id ? ' selected' : '') + '>' + esc(s.title) + '</option>';
          });
          html += '</select>';
          html += '<select class="select" id="map-status-select" style="width:auto" aria-label="Lọc trạng thái">';
          html += '<option value="all"' + (state.mapStatus === 'all' ? ' selected' : '') + '>Mọi trạng thái</option>';
          html += '<option value="completed"' + (state.mapStatus === 'completed' ? ' selected' : '') + '>Đã giải (AC)</option>';
          html += '<option value="in_progress"' + (state.mapStatus === 'in_progress' ? ' selected' : '') + '>Đang làm dở</option>';
          html += '<option value="available"' + (state.mapStatus === 'available' ? ' selected' : '') + '>Sẵn sàng làm</option>';
          html += '<option value="locked"' + (state.mapStatus === 'locked' ? ' selected' : '') + '>Chưa mở khóa</option>';
          html += '</select>';
          html += '</div>';

          // Vùng chứa danh sách chặng
          html += '<div class="stack" id="map-stages-list"></div>';

          container.innerHTML = html;

          // Hàm cập nhật riêng danh sách chặng bản đồ, KHÔNG vẽ lại ô tìm kiếm
          function updateMapStages() {
            var listEl = document.getElementById('map-stages-list');
            if (!listEl) return;

            var q = state.mapSearch.trim().toLowerCase();
            var visibleStages = stages.filter(function (s) {
              return state.mapStage === 'all' || s.id === state.mapStage;
            });

            var stagesHtml = '';
            var totalMatches = 0;

            visibleStages.forEach(function (stage) {
              var filteredLabs = (stage.labs || []).filter(function (l) {
                if (state.mapStatus !== 'all' && l.status !== state.mapStatus) return false;
                if (q) {
                  var matchTitle = l.title.toLowerCase().indexOf(q) !== -1;
                  var matchCode = l.code.toLowerCase().indexOf(q) !== -1;
                  var matchSkill = (l.skill || '').toLowerCase().indexOf(q) !== -1;
                  return matchTitle || matchCode || matchSkill;
                }
                return true;
              });

              totalMatches += filteredLabs.length;
              var stageTotal = (stage.labs || []).length;
              var stageDone = (stage.labs || []).filter(function (l) { return l.status === 'completed'; }).length;
              var stagePct = stageTotal ? Math.round((stageDone / stageTotal) * 100) : 0;

              // Lấy số thứ tự chặng gốc
              var origIdx = stages.findIndex(function (s) { return s.id === stage.id; });
              var stageNum = origIdx !== -1 ? (origIdx + 1) : 1;
              var stageNumStr = stageNum < 10 ? '0' + stageNum : String(stageNum);

              stagesHtml += '<section class="card card-pad">';
              stagesHtml += '<div class="row-between" style="flex-wrap:wrap;margin-bottom:12px;gap:8px">';
              stagesHtml += '<div>';
              stagesHtml += '<div class="row-gap" style="margin-bottom:4px"><span class="chip chip-mono">Chặng ' + stageNumStr + '</span><h2 style="font-size:16px;margin:0">' + esc(stage.title) + '</h2></div>';
              stagesHtml += '<div class="faint" style="font-size:13px">' + esc(stage.desc) + '</div>';
              stagesHtml += '</div>';
              stagesHtml += '<div style="text-align:right">';
              stagesHtml += '<div class="mono tnum" style="font-size:12.5px;color:var(--text-2);margin-bottom:4px">' + stageDone + '/' + stageTotal + ' bài (' + stagePct + '%)</div>';
              stagesHtml += '<div class="class-ticks" style="width:120px">' + ticks(stageTotal, stageDone, 'is-ok') + '</div>';
              stagesHtml += '</div>';
              stagesHtml += '</div>';

              if (filteredLabs.length === 0) {
                stagesHtml += '<div class="empty" style="padding:24px 0">Không có bài tập nào phù hợp với bộ lọc trong chặng này.</div>';
              } else {
                stagesHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px">';
                filteredLabs.forEach(function (lab) {
                  var isCompleted = lab.status === 'completed';
                  var isInProgress = lab.status === 'in_progress';
                  var isLocked = lab.status === 'locked';
                  var detailUrl = 'assignments.html?code=' + encodeURIComponent(lab.code);

                  if (isLocked) {
                    stagesHtml += '<div class="card card-pad lab-grid-card" style="background:var(--surface-2);opacity:0.7">';
                  } else {
                    stagesHtml += '<a class="card card-pad lab-grid-card is-link" href="' + detailUrl + '" style="background:var(--surface-2);text-decoration:none;color:inherit">';
                  }

                  stagesHtml += '<div>';
                  stagesHtml += '<div class="row-between" style="margin-bottom:8px">';
                  if (isCompleted) {
                    stagesHtml += verdict('AC');
                  } else if (isInProgress) {
                    stagesHtml += verdict('WA');
                  } else if (isLocked) {
                    stagesHtml += '<span class="chip"><i data-lucide="lock" style="width:12px;height:12px"></i>Chưa mở khóa</span>';
                  } else {
                    stagesHtml += '<span class="chip"><span class="dot"></span>Sẵn sàng</span>';
                  }
                  stagesHtml += '<span class="mono tnum" style="font-size:12px;color:var(--accent)">+' + (lab.points || 50) + ' XP</span>';
                  stagesHtml += '</div>';

                  stagesHtml += '<div style="font-weight:500;font-size:14px;line-height:1.4;margin-bottom:4px">' + esc(lab.title) + '</div>';
                  stagesHtml += '<div class="mono faint" style="font-size:12px;margin-bottom:10px">' + esc(lab.code) + '</div>';

                  stagesHtml += '<div class="row-gap" style="flex-wrap:wrap;margin-bottom:12px">';
                  if (lab.skill) stagesHtml += '<span class="chip" style="font-size:11px">' + esc(lab.skill) + '</span>';
                  stagesHtml += '<span class="chip" style="font-size:11px">' + esc(lab.diff || 'Mức 1') + '</span>';
                  if (typeof lab.solveRate === 'number') {
                    stagesHtml += '<span class="faint tnum" style="font-size:11.5px">' + lab.solveRate + '% giải</span>';
                  }
                  stagesHtml += '</div>';
                  stagesHtml += '</div>';

                  stagesHtml += '<div>';
                  if (isLocked) {
                    stagesHtml += '<button type="button" class="btn btn-sm" disabled style="width:100%"><i data-lucide="lock"></i>Cần mở khóa</button>';
                  } else {
                    var btnTxt = isCompleted ? 'Xem lại đề bài' : isInProgress ? 'Làm tiếp' : 'Bắt đầu làm';
                    var btnIcon = isCompleted ? 'check' : 'arrow-right';
                    stagesHtml += '<span class="btn btn-sm" style="width:100%"><i data-lucide="' + btnIcon + '"></i>' + btnTxt + '</span>';
                  }
                  stagesHtml += '</div>';

                  if (isLocked) {
                    stagesHtml += '</div>';
                  } else {
                    stagesHtml += '</a>';
                  }
                });
                stagesHtml += '</div>';
              }

              stagesHtml += '</section>';
            });

            if (totalMatches === 0) {
              stagesHtml += '<div class="card card-pad"><div class="empty" style="padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px">';
              stagesHtml += '<span>Không tìm thấy bài tập nào phù hợp. Thử đổi từ khóa hoặc xóa bộ lọc.</span>';
              stagesHtml += '<button type="button" class="btn btn-sm" id="reset-map-filter-btn"><i data-lucide="refresh-cw"></i>Xóa bộ lọc</button>';
              stagesHtml += '</div></div>';
            }

            listEl.innerHTML = stagesHtml;

            // Bắt sự kiện SPA click cho bài tập trong bản đồ
            listEl.querySelectorAll('a.lab-grid-card').forEach(function (link) {
              link.addEventListener('click', function (e) {
                e.preventDefault();
                navigate(link.getAttribute('href'));
              });
            });

            // Bắt sự kiện Xóa bộ lọc bản đồ
            var resetMapBtn = document.getElementById('reset-map-filter-btn');
            if (resetMapBtn) {
              resetMapBtn.addEventListener('click', function () {
                state.mapSearch = '';
                state.mapStage = 'all';
                state.mapStatus = 'all';
                var inp = document.getElementById('map-search-input');
                if (inp) inp.value = '';
                var sStage = document.getElementById('map-stage-select');
                if (sStage) sStage.value = 'all';
                var sStatus = document.getElementById('map-status-select');
                if (sStatus) sStatus.value = 'all';
                updateMapStages();
              });
            }

            window.clxIcons();
          }

          // Khởi tạo danh sách chặng
          updateMapStages();

          // Bộ lọc bản đồ — chỉ cập nhật danh sách kết quả, giữ ô nhập và con trỏ
          var mapSearchInput = document.getElementById('map-search-input');
          if (mapSearchInput) {
            mapSearchInput.addEventListener('input', function (e) {
              state.mapSearch = e.target.value;
              updateMapStages();
            });
          }
          var mapStageSelect = document.getElementById('map-stage-select');
          if (mapStageSelect) {
            mapStageSelect.addEventListener('change', function (e) {
              state.mapStage = e.target.value;
              updateMapStages();
            });
          }
          var mapStatusSelect = document.getElementById('map-status-select');
          if (mapStatusSelect) {
            mapStatusSelect.addEventListener('change', function (e) {
              state.mapStatus = e.target.value;
              updateMapStages();
            });
          }
        }

        // Bắt sự kiện Tab
        var tabClassesBtn = document.getElementById('tab-classes-btn');
        var tabMapBtn = document.getElementById('tab-map-btn');
        if (tabClassesBtn) {
          tabClassesBtn.addEventListener('click', function () {
            state.activeTab = 'class';
            window.history.pushState(null, '', 'assignments.html?tab=class');
            render();
          });
        }
        if (tabMapBtn) {
          tabMapBtn.addEventListener('click', function () {
            state.activeTab = 'map';
            window.history.pushState(null, '', 'assignments.html?tab=map');
            render();
          });
        }

        window.clxIcons();
      }

      // ==========================================
      // VIEW 2: DANH SÁCH BÀI CỦA MỘT LỚP
      // ==========================================
      function renderClassList(classObj) {

        var groups = [];
        var topics = [];
        assignments.forEach(function (a) {
          if (a.group && groups.indexOf(a.group) === -1) groups.push(a.group);
          if (a.topic && topics.indexOf(a.topic) === -1) topics.push(a.topic);
        });

        var html = '';

        // Hàng điều hướng trên cùng
        html += '<div class="row-between" style="margin-bottom:16px;flex-wrap:wrap;gap:12px">';
        html += '<div class="row-gap">';
        html += '<a class="btn btn-sm" href="assignments.html" id="back-to-roster"><i data-lucide="arrow-left"></i>Danh sách lớp</a>';
        html += '<div class="dim" style="font-size:13px">Lớp học phần <span class="faint">/ </span><b class="mono" style="color:var(--text);font-weight:500">' + esc(classObj.code) + '</b> · ' + esc(classObj.name) + '</div>';
        html += '</div>';

        // Toggle chuyển bảng / lưới
        html += '<div class="row-gap">';
        html += '<div class="segmented" role="group" aria-label="Chế độ hiển thị">';
        html += '<button type="button" id="view-mode-table"' + (state.assignView === 'table' ? ' aria-pressed="true"' : ' aria-pressed="false"') + ' aria-label="Xem dạng bảng"><i data-lucide="list"></i></button>';
        html += '<button type="button" id="view-mode-grid"' + (state.assignView === 'grid' ? ' aria-pressed="true"' : ' aria-pressed="false"') + ' aria-label="Xem dạng lưới"><i data-lucide="layout-grid"></i></button>';
        html += '</div>';
        html += '</div>';
        html += '</div>';

        // Card tóm tắt lớp học phần (tiến độ 20 vạch)
        var pct = classObj.total ? Math.round((classObj.done / classObj.total) * 100) : 0;
        var doneTicks = Math.round((classObj.done / classObj.total) * 20);

        html += '<section class="card card-pad" style="margin-bottom:20px">';
        html += '<div class="row-between" style="flex-wrap:wrap;gap:16px">';
        html += '<div>';
        html += '<h2 style="font-size:18px;margin-bottom:6px">' + esc(classObj.name) + '</h2>';
        html += '<div class="row-gap" style="font-size:13px;color:var(--text-2);flex-wrap:wrap">';
        html += '<span>Mã lớp: <b class="mono" style="color:var(--text);font-weight:500">' + esc(classObj.code) + '</b></span>';
        html += '<span>·</span>';
        html += '<span>' + esc(classObj.group) + '</span>';
        html += '<span>·</span>';
        html += '<span>GV: ' + esc(classObj.teacher) + '</span>';
        html += '<span>·</span>';
        html += '<span>' + classObj.credits + ' tín chỉ</span>';
        html += '<span>·</span>';
        html += '<span class="tnum">Hạn nộp: ' + esc(classObj.deadline) + '</span>';
        html += '</div>';
        html += '</div>';

        html += '<div style="min-width:200px">';
        html += '<div class="row-between" style="font-size:12px;margin-bottom:6px">';
        html += '<span class="dim">Tiến độ bài tập:</span>';
        html += '<span class="mono tnum dim">' + classObj.done + '/' + classObj.total + ' bài (' + pct + '%)</span>';
        html += '</div>';
        html += '<div class="class-ticks">' + ticks(20, doneTicks) + '</div>';
        html += '</div>';
        html += '</div>';
        html += '</section>';

        // Thanh công cụ tìm kiếm và lọc
        html += '<div class="toolbar" style="margin-bottom:16px">';
        html += '<div class="search" style="flex:1;min-width:220px"><i data-lucide="search"></i><input class="input" id="assign-search" placeholder="Tìm theo tên hoặc mã bài" value="' + esc(state.search) + '" aria-label="Tìm bài tập"></div>';

        html += '<select class="select" id="filter-group" style="width:auto" aria-label="Lọc nhóm">';
        html += '<option value="">Tất cả nhóm</option>';
        groups.forEach(function (g) {
          html += '<option value="' + esc(g) + '"' + (state.fGroup === g ? ' selected' : '') + '>' + esc(g) + '</option>';
        });
        html += '</select>';

        html += '<select class="select" id="filter-diff" style="width:auto" aria-label="Lọc độ khó">';
        html += '<option value="">Mọi độ khó</option>';
        html += '<option value="1"' + (state.fDiff === '1' ? ' selected' : '') + '>Mức 1</option>';
        html += '<option value="2"' + (state.fDiff === '2' ? ' selected' : '') + '>Mức 2</option>';
        html += '<option value="3"' + (state.fDiff === '3' ? ' selected' : '') + '>Mức 3</option>';
        html += '</select>';

        html += '<select class="select" id="filter-topic" style="width:auto" aria-label="Lọc chủ đề">';
        html += '<option value="">Mọi chủ đề</option>';
        topics.forEach(function (t) {
          html += '<option value="' + esc(t) + '"' + (state.fTopic === t ? ' selected' : '') + '>' + esc(t) + '</option>';
        });
        html += '</select>';

        html += '<div class="segmented" role="group" aria-label="Trạng thái làm bài">';
        html += '<button type="button" class="status-seg-btn" data-status=""' + (!state.fStatus ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>Tất cả</button>';
        html += '<button type="button" class="status-seg-btn" data-status="done"' + (state.fStatus === 'done' ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>Đã làm</button>';
        html += '<button type="button" class="status-seg-btn" data-status="undone"' + (state.fStatus === 'undone' ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>Chưa làm</button>';
        html += '</div>';
        html += '</div>';

        // Card chứa danh sách bài tập + host phân trang chuẩn CLXUI.pager
        html += '<div class="card" id="assign-card">';
        html += '<div id="assign-list-view"></div>';
        html += '<div class="pager-host" id="assign-pager"></div>';
        html += '</div>';

        container.innerHTML = html;

        // Bắt sự kiện quay lại
        var backBtn = document.getElementById('back-to-roster');
        if (backBtn) {
          backBtn.addEventListener('click', function (e) {
            e.preventDefault();
            navigate('assignments.html');
          });
        }

        // Bắt sự kiện chuyển chế độ bảng/lưới
        var modeTbl = document.getElementById('view-mode-table');
        var modeGrd = document.getElementById('view-mode-grid');
        if (modeTbl) {
          modeTbl.addEventListener('click', function () {
            state.assignView = 'table';
            modeTbl.setAttribute('aria-pressed', 'true');
            if (modeGrd) modeGrd.setAttribute('aria-pressed', 'false');
            updateAssignList();
          });
        }
        if (modeGrd) {
          modeGrd.addEventListener('click', function () {
            state.assignView = 'grid';
            modeGrd.setAttribute('aria-pressed', 'true');
            if (modeTbl) modeTbl.setAttribute('aria-pressed', 'false');
            updateAssignList();
          });
        }

        // Khởi tạo phân trang chuẩn bằng CLXUI.pager (chọn số dòng [1, 2, 5, 10, 20])
        var assignPager = pager(document.getElementById('assign-pager'), {
          total: assignments.length,
          page: state.page,
          size: state.pageSize,
          sizes: [1, 2, 5, 10, 20],
          onChange: function (p, s) {
            state.page = p;
            state.pageSize = s;
            updateAssignList();
          }
        });

        // Hàm cập nhật danh sách bài tập (sử dụng CLXUI.paginate và CLXUI.pager)
        function updateAssignList() {
          var listView = document.getElementById('assign-list-view');
          if (!listView) return;

          // Áp dụng bộ lọc
          var q = state.search.trim().toLowerCase();
          var filtered = assignments.filter(function (a) {
            if (q) {
              var mTitle = a.title.toLowerCase().indexOf(q) !== -1;
              var mCode = a.code.toLowerCase().indexOf(q) !== -1;
              if (!mTitle && !mCode) return false;
            }
            if (state.fGroup && a.group !== state.fGroup) return false;
            if (state.fDiff && String(a.diff) !== state.fDiff) return false;
            if (state.fTopic && a.topic !== state.fTopic) return false;
            if (state.fStatus === 'done' && !a.status) return false;
            if (state.fStatus === 'undone' && a.status) return false;
            return true;
          });

          var total = filtered.length;

          if (total === 0) {
            listView.innerHTML = '<div class="empty" style="padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:12px">' +
              '<span>Không tìm thấy bài tập nào phù hợp. Thử đổi từ khóa hoặc xóa bộ lọc.</span>' +
              '<button type="button" class="btn btn-sm" id="reset-filter-btn"><i data-lucide="refresh-cw"></i>Xóa bộ lọc</button>' +
              '</div>';
            assignPager.set({ total: 0, page: 1 });

            var resetBtn = document.getElementById('reset-filter-btn');
            if (resetBtn) {
              resetBtn.addEventListener('click', function () {
                state.search = '';
                state.fGroup = '';
                state.fDiff = '';
                state.fTopic = '';
                state.fStatus = '';
                state.page = 1;
                var sInp = document.getElementById('assign-search');
                if (sInp) sInp.value = '';
                var fgEl = document.getElementById('filter-group');
                if (fgEl) fgEl.value = '';
                var fdEl = document.getElementById('filter-diff');
                if (fdEl) fdEl.value = '';
                var ftEl = document.getElementById('filter-topic');
                if (ftEl) ftEl.value = '';
                document.querySelectorAll('.status-seg-btn').forEach(function (b) {
                  b.setAttribute('aria-pressed', b.dataset.status === '' ? 'true' : 'false');
                });
                updateAssignList();
              });
            }
            window.clxIcons();
            return;
          }

          var totalPages = Math.ceil(total / state.pageSize) || 1;
          if (state.page > totalPages) state.page = 1;
          var startIdx = (state.page - 1) * state.pageSize;
          var pageItems = paginate(filtered, state.page, state.pageSize);

          var listHtml = '';

          if (state.assignView === 'table') {
            listHtml += '<div class="tbl tbl-class-assign" role="table" aria-label="Danh sách bài tập">';
            listHtml += '<div role="rowgroup">';
            listHtml += '<div class="tbl-row tbl-head" role="row">';
            listHtml += '<span role="columnheader" class="col-stt">STT</span>';
            listHtml += '<span role="columnheader" class="col-code">Mã bài</span>';
            listHtml += '<span role="columnheader" class="col-title">Tiêu đề</span>';
            listHtml += '<span role="columnheader" class="col-attempts">Lượt nộp</span>';
            listHtml += '<span role="columnheader" class="col-topic">Chủ đề</span>';
            listHtml += '<span role="columnheader" class="col-diff">Độ khó</span>';
            listHtml += '<span role="columnheader" class="num col-status">Kết quả</span>';
            listHtml += '</div>';
            listHtml += '</div>';

            listHtml += '<div role="rowgroup">';
            pageItems.forEach(function (row, idx) {
              var stt = startIdx + idx + 1;
              var diffLabel = 'Mức ' + (row.diff || 1);
              var statusHtml = row.status ? verdict(row.status) : '<span class="faint" style="font-size:12px">Chưa làm</span>';
              var detailUrl = 'assignments.html?class=' + encodeURIComponent(classObj.code) + '&code=' + encodeURIComponent(row.code);

              listHtml += '<a class="tbl-row is-link assign-row" href="' + detailUrl + '" data-code="' + esc(row.code) + '" role="row">';
              listHtml += '<span role="cell" class="mono tnum faint col-stt">' + stt + '</span>';

      // ==========================================

        var steps = assignment.steps || [

          { n: 3, t: 'Thu thập kết quả', d: 'Xuất file chứng nhận kết quả .lab để nộp bài.' }
        ];

        // Xác định số bước đã hoàn thành
        var doneSteps = 0;
        if (assignment.status === 'AC') {
          doneSteps = steps.length;
        } else if (assignment.status === 'WFN') {
          doneSteps = 0;
        } else if (assignment.status === 'WA' || assignment.status === 'WF') {
          doneSteps = Math.max(1, steps.length - 1);
        }

        // Lọc bình luận theo đúng bài đang xem (Item 17)
        var currentClassCode = assignment.classCode || (classObj ? classObj.code : '');
        var currentLabComments = state.comments.filter(function (c) {
          if (c.assignmentCode) {
            return c.assignmentCode === assignment.code;
          }
          return assignment.code === 'nmap-discovery';
        });

        // Lọc lịch sử nộp bài: đúng theo mã bài hoặc đúng cả tiêu đề và môn học
        var allHistory = (state.extraHistory || []).concat(D.history || []);
        var currentLabHistory = allHistory.filter(function (h) {
          if (h.code && assignment.code) {
            return h.code === assignment.code;
          }
          var hTitle = h.title || h.ex;
          if (hTitle && hTitle === assignment.title) {
            if (assignment.courseName && h.course) {
              return h.course === assignment.courseName;
            }
            return true;
          }
          return false;
        });

        var html = '';

        // Nút quay lại
        html += '<div style="margin-bottom:20px">';

        // 1. Thẻ giới thiệu bài tập: đầu trang là hàng mã bài + Mức + hạn nộp (không lặp tiêu đề lớn)

          var res = state.submitResult;
          html += '<hr class="divider" style="margin:16px 0">';
          html += '<div style="padding:16px;border-radius:var(--r-card);background:var(--surface-2);border:1px solid var(--line-strong)">';
          html += '<div class="row-between" style="margin-bottom:8px">';
          html += '<div class="row-gap">' + verdict(res.verdict) + '<b style="font-size:13.5px;font-weight:500">' + esc(res.title) + '</b></div>';
          html += '<span class="mono tnum" style="font-weight:500;color:var(--' + (res.verdict === 'AC' ? 'ok' : 'err') + ')">' + esc(res.scoreLabel) + '</span>';
          html += '</div>';
          html += '<div class="faint tnum" style="font-size:12px;margin-bottom:12px">' + esc(res.attemptLabel) + ' · ' + esc(res.time) + '</div>';

          html += '<ul style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;list-style:none;padding:0;margin:0">';
          res.items.forEach(function (it) {
            html += '<li class="row-between">';
            html += '<span>' + esc(it.label) + '</span>';
            html += '<span class="chip ' + (it.ok ? 'chip-ok' : 'chip-err') + '"><span class="dot"></span>' + (it.ok ? 'Đạt' : 'Chưa đạt') + '</span>';
            html += '</li>';
          });
          html += '</ul>';

          html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:right">';
          html += '<a class="link" href="history.html" style="font-size:12.5px">Xem trong Lịch sử →</a>';
          html += '</div>';
          html += '</div>';
        }

        html += '</section>';

        html += '</aside>'; // End cột phụ
        html += '</div>';   // End .cols

        container.innerHTML = html;

        // Bắt sự kiện quay lại
        var backBtn = document.getElementById('back-from-detail');
        if (backBtn) {
          backBtn.addEventListener('click', function (e) {
            e.preventDefault();
            navigate(backUrl);
          });
        }

        // Khởi tạo phân trang lịch sử bài nộp bằng CLXUI.pager
        var detailHistPager = pager(document.getElementById('detail-hist-pager'), {
          total: currentLabHistory.length,
          page: state.histPage,
          size: state.histPageSize,
          sizes: [1, 2, 5, 10],
          onChange: function (p, s) {
            state.histPage = p;
            state.histPageSize = s;
            updateDetailHistView();
          }
        });

        // Hàm vẽ bảng lịch sử nộp bài của bài này
        function updateDetailHistView() {
          var viewEl = document.getElementById('detail-hist-view');
          if (!viewEl) return;

          var total = currentLabHistory.length;
          if (total === 0) {
            viewEl.innerHTML = '<div class="empty" style="padding:24px 16px">Bạn chưa nộp bài tập này lần nào.</div>';
            detailHistPager.set({ total: 0, page: 1 });
            return;
          }

          var totalPages = Math.ceil(total / state.histPageSize) || 1;
          if (state.histPage > totalPages) state.histPage = 1;
          var startIdx = (state.histPage - 1) * state.histPageSize;
          var pageItems = paginate(currentLabHistory, state.histPage, state.histPageSize);

          var hHtml = '<div class="tbl ledger tbl-ledger-hist" role="table" aria-label="Lịch sử nộp bài của bài này">';
          hHtml += '<div role="rowgroup">';
          hHtml += '<div class="tbl-row tbl-head" role="row">';
          hHtml += '<span role="columnheader" class="no">#</span>';
          hHtml += '<span role="columnheader" class="col-id">ID</span>';
          hHtml += '<span role="columnheader" class="col-time">Thời gian</span>';
          hHtml += '<span role="columnheader" class="col-ex">Ghi chú nộp bài</span>';
          hHtml += '<span role="columnheader" class="num col-score">Điểm</span>';
          hHtml += '<span role="columnheader" class="num col-res">Kết quả</span>';
          hHtml += '</div>';
          hHtml += '</div>';
          hHtml += '<div role="rowgroup">';

          pageItems.forEach(function (item, idx) {
            var stt = startIdx + idx + 1;
            var sttStr = '#' + (stt < 10 ? '0' + stt : String(stt));
            var scoreVal = item.score || (item.status === 'AC' ? ((assignment.points || 50) + '/' + (assignment.points || 50)) : ('0/' + (assignment.points || 50)));

            hHtml += '<div class="tbl-row" role="row">';
            hHtml += '<span role="cell" class="no">' + sttStr + '</span>';
            hHtml += '<span role="cell" class="mono tnum faint col-id">' + item.id + '</span>';
            hHtml += '<span role="cell" class="mono tnum faint col-time" style="font-size:12.5px">' + esc(item.time) + '</span>';
            hHtml += '<div role="cell" class="col-ex" style="min-width:0">';
            hHtml += '<div class="trunc" style="font-weight:500">' + esc(item.ex || item.title || assignment.title) + '</div>';
            hHtml += '<div class="ledger-mobile-meta mobile-sub">';
            hHtml += '<span class="mono">' + sttStr + '</span><span>·</span>';
            hHtml += '<span class="tnum">' + esc(item.time) + '</span><span>·</span>';
            hHtml += '<span class="tnum">' + esc(scoreVal) + '</span>';
            hHtml += '</div>';
            hHtml += '</div>';
            hHtml += '<span role="cell" class="num mono tnum col-score">' + esc(scoreVal) + '</span>';
            hHtml += '<span role="cell" class="num col-res">' + verdict(item.status) + '</span>';
            hHtml += '</div>';
          });

          hHtml += '</div>';
          hHtml += '</div>';

          viewEl.innerHTML = hHtml;
          detailHistPager.set({ total: total, page: state.histPage, size: state.histPageSize });
        }

        updateDetailHistView();

        // Xây dựng cây bình luận đệ quy bằng DOM (an toàn tuyệt đối chống XSS, hiển thị SCM-003 dưới SCM-002)
        var commentsContainer = document.getElementById('comments-list');
        if (commentsContainer) {
          commentsContainer.innerHTML = '';
          if (currentLabComments.length === 0) {
            commentsContainer.innerHTML = '<div class="empty" style="padding:28px 16px"><p style="font-size:13px;color:var(--text-3)">Chưa có bình luận nào cho bài tập này. Đặt câu hỏi đầu tiên để nhận hỗ trợ từ giảng viên và trợ giảng.</p></div>';
          } else {
            function buildCommentElement(c, depth) {
              var card = document.createElement('div');
              card.className = depth === 0 ? 'comment-card' : 'comment-reply';
              if (depth > 1) {
                card.style.marginLeft = '16px';
              }

              var header = document.createElement('div');
              header.className = 'row-between';
              header.style.marginBottom = depth === 0 ? '6px' : '4px';

              var userGap = document.createElement('div');
              userGap.className = 'row-gap';

              var avatar = document.createElement('span');
              avatar.className = 'avatar avatar-sm';
              avatar.textContent = c.name ? c.name.slice(0, 2) : 'SV';

              var nameSpan = document.createElement('span');
              nameSpan.style.cssText = 'font-weight:500;font-size:13px';
              nameSpan.textContent = c.name;

              userGap.appendChild(avatar);
              userGap.appendChild(nameSpan);

              if (c.role) {
                var roleChip = document.createElement('span');
                roleChip.className = 'chip'; // Chip trung tính theo AUDIT mục 25
                roleChip.style.fontSize = '11px';
                roleChip.textContent = c.role;
                userGap.appendChild(roleChip);
              }

              var timeSpan = document.createElement('span');
              timeSpan.className = 'faint tnum';
              timeSpan.style.fontSize = '12px';
              timeSpan.textContent = c.time;

              header.appendChild(userGap);
              header.appendChild(timeSpan);
              card.appendChild(header);

              // Nội dung bình luận — gán textContent an toàn tuyệt đối
              var contentDiv = document.createElement('div');
              contentDiv.style.cssText = depth === 0
                ? 'font-size:13.5px;color:var(--text);line-height:1.5;margin-bottom:8px'
                : 'font-size:13px;color:var(--text);line-height:1.5;margin-bottom:6px';
              contentDiv.textContent = c.content;
              card.appendChild(contentDiv);

              // Nút trả lời
              var actDiv = document.createElement('div');
              var repBtn = document.createElement('button');
              repBtn.type = 'button';
              repBtn.className = 'btn btn-ghost btn-sm reply-btn';
              repBtn.setAttribute('data-id', c.id);
              repBtn.setAttribute('data-name', c.name);
              repBtn.innerHTML = '<i data-lucide="message-square"></i>Trả lời';
              repBtn.addEventListener('click', function () {
                var ta = document.getElementById('comment-textarea');
                if (ta) {
                  ta.value = '@' + c.name + ' ';
                  state.replyParentId = c.id;
                  ta.focus();
                }
              });
              actDiv.appendChild(repBtn);
              card.appendChild(actDiv);

              // Đệ quy dựng toàn bộ luồng con theo parentId trong cùng bài (Item 17)
              var children = currentLabComments.filter(function (child) {
                return child.parentId === c.id;
              });
              children.forEach(function (child) {
                card.appendChild(buildCommentElement(child, depth + 1));
              });

              return card;
            }

            var rootComments = currentLabComments.filter(function (c) { return !c.parentId; });
            rootComments.forEach(function (rc) {
              commentsContainer.appendChild(buildCommentElement(rc, 0));
            });
          }
        }

        // Bắt sự kiện hủy trả lời nếu có
        var cancelReplyBtn = document.getElementById('cancel-reply-btn');
        if (cancelReplyBtn) {
          cancelReplyBtn.addEventListener('click', function () {
            state.replyParentId = null;
            var ta = document.getElementById('comment-textarea');
            if (ta) ta.value = '';
            render();
          });
        }

        // Tương tác duyệt file .lab & kéo thả
        var fileInput = document.getElementById('lab-file-picker');
        var dropzone = document.getElementById('lab-dropzone');
        var submitBtn = document.getElementById('submit-lab-btn');
        var pickSampleBtn = document.getElementById('pick-sample-file-btn');

        if (dropzone && fileInput && !isExhausted) {
          dropzone.addEventListener('click', function () {
            fileInput.click();
          });
          dropzone.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add('is-dragover');
          });
          dropzone.addEventListener('dragleave', function (e) {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('is-dragover');
          });
          dropzone.addEventListener('drop', function (e) {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('is-dragover');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
              state.pickedFile = e.dataTransfer.files[0];
              render();
            }
          });
          fileInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
              state.pickedFile = e.target.files[0];
              render();
            }
          });
        }

        if (pickSampleBtn && !isExhausted) {
          pickSampleBtn.addEventListener('click', function () {
            state.pickedFile = {
              name: expectedFileName,
              size: 24576
            };
            render();
          });
        }

        // Bắt sự kiện Nộp bài (lấy điểm, lượt nộp, đồng hồ thực)
        if (submitBtn) {
          submitBtn.addEventListener('click', function () {
            var att = getAssignmentAttempts(assignment);
            if (att.used >= att.max) return; // Chặn thao tác khi hết lượt (Item 4)
            if (!state.pickedFile) return;

            var fileName = state.pickedFile.name;
            var isCorrectName = fileName === expectedFileName;
            var nowStr = getNowFormatted();

            var maxPoints = assignment.points || assignment.xp || 50;
            var maxAttempts = att.max;
            var newUsed = att.used + 1;
            var newAttemptsStr = newUsed + '/' + maxAttempts;
            var attemptLabel = 'Lần nộp ' + newUsed + '/' + maxAttempts;

            var verdictCode = isCorrectName ? 'AC' : 'WFN';
            var title = isCorrectName ? 'Kết quả đúng (Accepted)' : 'Sai tên tệp (Wrong File Name)';
            var score = isCorrectName ? maxPoints : 0;
            var scoreLabel = isCorrectName ? (maxPoints + '/' + maxPoints + ' XP') : ('0/' + maxPoints + ' XP');

            // Ghi MỌI kết quả nộp vào lịch sử cục bộ (Item 4)
            state.extraHistory.unshift({
              id: 72200 + state.extraHistory.length,
              code: assignment.code,
              time: nowStr,
              course: assignment.courseName || 'An toàn & Bảo mật HTTT',
              title: assignment.title,
              ex: assignment.title,
              score: score + '/' + maxPoints + ' (' + verdictCode + ')',
              status: verdictCode
            });

            // Xác định trạng thái mới: nếu đã AC thì giữ nguyên AC, chưa AC thì cập nhật theo verdict
            var newStatus = (assignment.status === 'AC') ? 'AC' : verdictCode;

            // Cập nhật nguồn dữ liệu & state dùng chung (Item 2 & Item 4)
            updateAssignmentState(assignment.code, newStatus, newAttemptsStr);

            state.submitResult = {
              verdict: verdictCode,
              title: title,
              scoreLabel: scoreLabel,
              attemptLabel: attemptLabel,
              time: nowStr,
              items: isCorrectName ? steps.map(function (s) {
                return { label: s.t, ok: true };
              }) : [
                { label: 'Quy chuẩn tên tệp: ' + expectedFileName, ok: false }
              ]
            };

            render();
          });
        }

        // Bắt sự kiện gửi bình luận
        var postCommentBtn = document.getElementById('post-comment-btn');
        var commentTextarea = document.getElementById('comment-textarea');
        if (postCommentBtn && commentTextarea) {
          postCommentBtn.addEventListener('click', function () {
            var val = commentTextarea.value.trim();
            if (!val) return;

            var newC = {
              id: 'SCM-' + (state.comments.length + 1).toString().padStart(3, '0'),
              classCode: currentClassCode,
              assignmentCode: assignment.code,
              userId: 7,
              parentId: state.replyParentId || null,
              account: D.student ? D.student.code : 'B23DCCN135',
              name: D.student ? D.student.name : 'Vũ Trung Đức',
              role: 'Sinh viên',
              time: 'Vừa xong',
              content: val
            };

            if (state.replyParentId) {
              state.comments.push(newC);
            } else {
              state.comments.unshift(newC);
            }
            state.replyParentId = null;
            state.commentText = '';
            render();
          });
        }

        window.clxIcons();
      }

      // ==========================================
      // ROUTER CHÍNH ĐIỀU PHỐI GIAO DIỆN
      // ==========================================
      function render() {
        var params = getParams();

        if (params.code) {
          if (state.currentCode !== params.code) {
            state.currentCode = params.code;
            state.pickedFile = null;
            state.submitResult = null;
            state.replyParentId = null;
            state.commentText = '';
            state.histPage = 1;
          }
          // Mode 3: Chi tiết bài tập
          var classObj = findClass(params.classCode);
          var assignObj = findAssignment(params.code, classObj);
          if (assignObj) {
            renderDetail(assignObj, classObj);
          } else {
            if (classObj) renderClassList(classObj);
            else renderOverview('class');
          }
        } else if (params.classCode) {
          state.currentCode = null;
          // Mode 2: Danh sách bài của lớp
          var c = findClass(params.classCode);
          if (c) {
            renderClassList(c);
          } else {
            renderOverview('class');
          }
        } else {
          state.currentCode = null;
          // Mode 1: Tổng quan (Lớp học phần hoặc Bản đồ)
          renderOverview(params.tab || state.activeTab);
        }
      }

      // Lắng nghe popstate (nút Back/Forward của trình duyệt)
      window.addEventListener('popstate', function () {
        render();
      });

      // Khởi động
      render();
    })();
  </script>
</body>
</html>
