<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBot · CyberLabX</title>
  <link rel="stylesheet" href="assets/vendor/fonts.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/skin-quest.css">
  <script src="assets/theme.js"></script>
  <style>
    /* Kiểu riêng trang ChatBot toàn trang */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--topbar-h) - 48px);
      min-height: 520px;
      max-height: 860px;
      overflow: hidden;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-msg {
      display: flex;
      gap: 12px;
      max-width: min(720px, 85%);
      align-items: flex-start;
    }
    .chat-msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--r-control);
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--text-2);
      flex: none;
    }
    .chat-msg.user .msg-avatar {
      background: var(--surface-3);
      color: var(--text);
    }
    .msg-avatar svg {
      width: 16px;
      height: 16px;
    }
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .chat-msg.user .msg-content {
      align-items: flex-end;
    }
    .msg-bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.bot .msg-bubble {
      background: var(--surface-2);
      color: var(--text);
      border-radius: var(--r-card);
      border: 1px solid var(--line);
    }
    .chat-msg.user .msg-bubble {
      background: var(--surface-3);
      color: var(--text);
      border-radius: var(--r-card);
      border: 1px solid var(--line);
    }
    .msg-time {
      font-size: 11px;
      color: var(--text-3);
      padding: 0 4px;
    }
    .suggestions-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      background: var(--bg);
      scrollbar-width: none;
    }
    .suggestions-strip::-webkit-scrollbar {
      display: none;
    }
    .suggestion-btn {
      height: 32px;
      min-height: 32px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: var(--r-control);
      white-space: nowrap;
    }
    .chat-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    @media (max-width: 640px) {
      .chat-container {
        height: calc(100vh - var(--topbar-h) - 24px);
      }
      .chat-body {
        padding: 16px;
      }
      .suggestions-strip {
        padding: 8px 16px;
      }
      .chat-footer {
        padding: 12px 16px;
      }
      .chat-msg {
        max-width: 95%;
      }
    }
  </style>
</head>
<body data-page="chatbot" data-title="ChatBot">
  <main class="content" id="content">
    <div class="card chat-container" aria-label="Khung trò chuyện ChatBot">
      <!-- Đầu khung Chat -->
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <span class="msg-avatar" style="width:34px;height:34px">
            <i data-lucide="message-square"></i>
          </span>
          <div style="min-width:0">
            <h2 style="font-size:14px;font-weight:600">ChatBot CyberLabX</h2>
            <div class="faint" style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px">
              <span class="dot" style="background:var(--ok);flex:none"></span>
              <span class="trunc">Trực tuyến · Trợ lý phòng lab</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-reset-chat" title="Đặt lại cuộc trò chuyện" style="flex:none">
          <i data-lucide="rotate-ccw"></i>
          <span>Bắt đầu lại</span>
        </button>
      </div>

      <!-- Danh sách tin nhắn (an toàn qua textContent, không câu chào đóng khung sẵn) -->
      <div class="chat-body" id="chat-messages" role="log" aria-live="polite"></div>

      <!-- Dải câu hỏi gợi ý là các nút 32px -->
      <div class="suggestions-strip" aria-label="Gợi ý câu hỏi thường gặp">
        <span class="faint" style="font-size:12px;white-space:nowrap">Gợi ý:</span>
        <button type="button" class="btn btn-sm suggestion-btn" data-query="Lỗi WFN là gì và xử lý thế nào?">Lỗi WFN là gì?</button>
        <button type="button" class="btn btn-sm suggestion-btn" data-query="Quy trình xuất và nộp tệp .lab như thế nào?">Cách nộp bài .lab?</button>
        <button type="button" class="btn btn-sm suggestion-btn" data-query="Không kết nối được máy ảo Labtainer thì làm sao?">Lỗi kết nối máy ảo?</button>
        <button type="button" class="btn btn-sm suggestion-btn" data-query="Các bài tập có hạn nộp trong tuần này?">Hạn nộp tuần này</button>
      </div>

      <!-- Khung soạn tin nhắn: nút Gửi là nút chính duy nhất -->
      <div class="chat-footer">
        <form id="chat-form" class="chat-input-row">
          <input
            id="chat-input"
            class="input"
            type="text"
            placeholder="Nhập câu hỏi của bạn... (nhấn Enter để gửi)"
            aria-label="Nội dung câu hỏi"
            autocomplete="off"
            required
          >
          <button type="submit" class="btn btn-primary" id="btn-send">
            <i data-lucide="send"></i>
            <span>Gửi</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Hộp thoại xác nhận bắt đầu lại cuộc trò chuyện (CLXUI.modal) -->
  <div class="dlg-scrim" id="confirm-reset-dialog" hidden>
    <div class="card card-pad" role="dialog" aria-modal="true" aria-labelledby="reset-dialog-title" style="width:min(440px,calc(100vw - 32px))">
      <h2 id="reset-dialog-title" style="font-size:15px;font-weight:600">Bắt đầu lại cuộc trò chuyện?</h2>
      <div class="faint" style="font-size:13px;line-height:1.5;margin:8px 0 20px">
        Toàn bộ nội dung trao đổi trong phiên này sẽ được khôi phục về trạng thái ban đầu. Bạn có chắc chắn muốn bắt đầu lại?
      </div>
      <div class="row-gap" style="justify-content:flex-end">
        <button type="button" class="btn btn-sm" data-close id="btn-cancel-reset">Hủy</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-confirm-reset">Xác nhận đặt lại</button>
      </div>
    </div>
  </div>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var D = window.CLX;
      var msgContainer = document.getElementById('chat-messages');
      var chatForm = document.getElementById('chat-form');
      var chatInput = document.getElementById('chat-input');
      var resetBtn = document.getElementById('btn-reset-chat');
      var resetDialog = document.getElementById('confirm-reset-dialog');
      var cancelResetBtn = document.getElementById('btn-cancel-reset');
      var confirmResetBtn = document.getElementById('btn-confirm-reset');

      // Khởi tạo modal chuẩn của CyberLabX
      var resetModal = CLXUI.modal(resetDialog, { initialFocus: '#btn-cancel-reset' });
      var botReplyTimer = null;
      var sessionGen = 0;

      // Khởi tạo danh sách tin nhắn từ CLX.chat
      function initChatLog() {
        return (D.chat || []).map(function (m) {
          return {
            from: m.from === 'me' ? 'user' : m.from,
            text: m.text,
            time: m.time || null
          };
        });
      }

      var chatLog = initChatLog();

      // Hiển thị tin nhắn: TUYỆT ĐỐI dùng textContent để chống chèn HTML / XSS
      function renderMessages() {
        msgContainer.innerHTML = '';
        chatLog.forEach(function (msg) {
          var isBot = msg.from === 'bot';
          var icon = isBot ? 'message-square' : 'user-round';

          var msgEl = document.createElement('div');
          msgEl.className = 'chat-msg ' + (isBot ? 'bot' : 'user');

          var avatar = document.createElement('span');
          avatar.className = 'msg-avatar';
          var ic = document.createElement('i');
          ic.setAttribute('data-lucide', icon);
          avatar.appendChild(ic);

          var content = document.createElement('div');
          content.className = 'msg-content';

          var bubble = document.createElement('div');
          bubble.className = 'msg-bubble';
          // Sử dụng textContent theo đúng quy tắc an toàn bảo mật
          bubble.textContent = msg.text;
          content.appendChild(bubble);

          if (msg.time) {
            var timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time mono tnum';
            timeSpan.textContent = msg.time;
            content.appendChild(timeSpan);
          }

          msgEl.appendChild(avatar);
          msgEl.appendChild(content);
          msgContainer.appendChild(msgEl);
        });

        window.clxIcons();
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      function getBotAnswer(query) {
        var q = query.toLowerCase();
        if (q.indexOf('wfn') !== -1 || q.indexOf('tên tệp') !== -1 || q.indexOf('tên file') !== -1) {
          return 'Lỗi WFN (Wrong File Name) xảy ra khi tên tệp nộp không đúng quy định. Không đổi tên tệp .lab sinh ra sau khi chạy lệnh kết thúc lab (stoplab). Nộp lại đúng tệp gốc do máy ảo sinh ra.';
        }
        if (q.indexOf('nộp') !== -1 || q.indexOf('cách nộp') !== -1 || q.indexOf('.lab') !== -1) {
          return 'Quy trình nộp bài gồm 4 bước:\n1. Mở bài lab trong máy ảo Labtainer.\n2. Hoàn thành tuần tự các bước trong đề bài.\n3. Chạy lệnh stoplab để đóng bài và sinh tệp .lab.\n4. Vào mục Bài tập, mở bài tương ứng và nộp tệp .lab để chấm tự động.';
        }
        if (q.indexOf('kết nối') !== -1 || q.indexOf('máy ảo') !== -1 || q.indexOf('labtainer') !== -1 || q.indexOf('docker') !== -1) {
          return 'Khi gặp lỗi kết nối máy ảo: Kiểm tra dịch vụ Docker trên máy, đảm bảo mạng ảo giữa máy chủ và container đang thông suốt. Nếu vẫn không được, tham khảo mục Hướng dẫn phòng lab.';
        }
        if (q.indexOf('hạn') !== -1 || q.indexOf('tuần') !== -1 || q.indexOf('deadline') !== -1) {
          var pending = [];
          (D.classes || []).forEach(function (c) {
            (c.assignments || []).forEach(function (a) {
              if (a.status !== 'AC') {
                pending.push('• ' + a.title + ' (' + c.course + ') — Hạn ' + a.deadline);
              }
            });
          });
          if (pending.length) {
            return 'Các bài tập chưa đạt AC sắp đến hạn của bạn:\n' + pending.slice(0, 4).join('\n');
          }
          return 'Hiện tại bạn không có bài tập nào sắp đến hạn cần xử lý.';
        }
        return 'Hệ thống đã ghi nhận nội dung câu hỏi. Bạn có thể tham khảo mục Hướng dẫn hoặc liên hệ trợ giảng / giảng viên phụ trách học phần.';
      }

      function sendUserMessage(text) {
        var clean = text.trim();
        if (!clean) return;

        chatLog.push({
          from: 'user',
          text: clean
        });
        renderMessages();

        // Codex-final mục 19: Hủy timeout cũ và ghi nhận phiên hội thoại
        if (botReplyTimer) {
          clearTimeout(botReplyTimer);
          botReplyTimer = null;
        }
        var currentGen = sessionGen;
        botReplyTimer = setTimeout(function () {
          botReplyTimer = null;
          if (currentGen !== sessionGen) return;
          var answer = getBotAnswer(clean);
          chatLog.push({
            from: 'bot',
            text: answer
          });
          renderMessages();
        }, 300);
      }

      chatForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var val = chatInput.value;
        if (!val) return;
        chatInput.value = '';
        sendUserMessage(val);
      });

      // Bấm nút gợi ý câu hỏi (các nút 32px)
      document.querySelectorAll('.suggestion-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var q = btn.dataset.query;
          sendUserMessage(q);
        });
      });

      // Bắt đầu lại có hộp xác nhận (dùng CLXUI.modal chuẩn)
      resetBtn.addEventListener('click', function () {
        resetModal.open();
      });

      cancelResetBtn.addEventListener('click', function () {
        resetModal.close();
      });

      confirmResetBtn.addEventListener('click', function () {
        // Hủy timer bot phản hồi đang chờ và tăng số phiên
        if (botReplyTimer) {
          clearTimeout(botReplyTimer);
          botReplyTimer = null;
        }
        sessionGen++;
        chatLog = initChatLog();
        renderMessages();
        resetModal.close();
      });

      renderMessages();
    })();
  </script>
</body>
</html>
