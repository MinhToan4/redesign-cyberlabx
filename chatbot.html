<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBot · CyberLabX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <script src="assets/theme.js"></script>
  <style>
    /* Kiểu riêng trang ChatBot toàn trang */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--topbar-h) - 56px);
      min-height: 520px;
      max-height: 860px;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-msg {
      display: flex;
      gap: 12px;
      max-width: min(720px, 85%);
      align-items: flex-start;
    }
    .chat-msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--text-2);
      flex: none;
    }
    .chat-msg.user .msg-avatar {
      background: var(--surface-3);
      color: var(--text);
    }
    .msg-avatar svg {
      width: 16px;
      height: 16px;
    }
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-msg.user .msg-content {
      align-items: flex-end;
    }
    .msg-bubble {
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-line;
    }
    .chat-msg.bot .msg-bubble {
      background: var(--surface-2);
      color: var(--text);
      border-radius: var(--r-card);
      border: 1px solid var(--line);
    }
    .chat-msg.user .msg-bubble {
      background: var(--surface-3);
      color: var(--text);
      border-radius: var(--r-card);
      border: 1px solid var(--line);
    }
    .msg-time {
      font-size: 11px;
      color: var(--text-3);
      padding: 0 4px;
    }
    .suggestions-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      background: var(--bg);
      scrollbar-width: none;
    }
    .suggestions-strip::-webkit-scrollbar {
      display: none;
    }
    .suggestion-btn {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .suggestion-btn:hover {
      background: var(--mute-soft);
      color: var(--text);
      border-color: var(--accent);
    }
    dialog::backdrop {
      background: var(--scrim);
    }
    .chat-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    @media (max-width: 640px) {
      .chat-container {
        height: calc(100vh - var(--topbar-h) - 32px);
      }
      .chat-body {
        padding: 16px;
      }
      .suggestions-strip {
        padding: 8px 16px;
      }
      .chat-footer {
        padding: 12px 16px;
      }
      .chat-msg {
        max-width: 95%;
      }
    }
  </style>
</head>
<body data-page="chatbot" data-title="ChatBot">
  <main class="content" id="content">
    <div class="card chat-container" aria-label="Khung trò chuyện ChatBot">
      <!-- Đầu khung Chat -->
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:12px">
          <span class="msg-avatar" style="width:36px;height:36px">
            <i data-lucide="message-square"></i>
          </span>
          <div>
            <h2 style="font-size:15px;font-weight:600">ChatBot CyberLabX</h2>
            <div class="faint" style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px">
              <span class="dot" style="background:var(--ok)"></span>
              <span>Đang hoạt động · Trợ lý giải đáp phòng lab 24/7</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-reset-chat" title="Đặt lại cuộc trò chuyện">
          <i data-lucide="rotate-ccw"></i>
          <span class="trunc">Bắt đầu lại</span>
        </button>
      </div>

      <!-- Hộp thoại xác nhận bắt đầu lại -->
      <dialog id="confirm-reset-dialog" class="card" style="border:1px solid var(--line-strong);border-radius:var(--r-card);max-width:420px;padding:24px;background:var(--surface);color:var(--text);margin:auto">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:6px">Bắt đầu lại cuộc trò chuyện?</h3>
        <div class="faint" style="font-size:13px;line-height:1.5;margin-bottom:20px">
          Toàn bộ lịch sử trao đổi hiện tại sẽ được làm mới. Bạn có chắc chắn muốn bắt đầu lại?
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button type="button" class="btn btn-sm" id="btn-cancel-reset">Hủy</button>
          <button type="button" class="btn btn-primary btn-sm" id="btn-confirm-reset">Đặt lại</button>
        </div>
      </dialog>

      <!-- Danh sách tin nhắn -->
      <div class="chat-body" id="chat-messages" role="log" aria-live="polite">
        <!-- Tin nhắn được chèn bằng JS -->
      </div>

      <!-- Dải câu hỏi gợi ý -->
      <div class="suggestions-strip" aria-label="Gợi ý câu hỏi thường gặp">
        <span class="faint" style="font-size:12px;white-space:nowrap">Gợi ý:</span>
        <button type="button" class="suggestion-btn" data-query="Lỗi WFN là gì và xử lý thế nào?">Lỗi WFN là gì?</button>
        <button type="button" class="suggestion-btn" data-query="Quy trình xuất và nộp tệp .lab như thế nào?">Cách nộp bài .lab?</button>
        <button type="button" class="suggestion-btn" data-query="Không kết nối được máy ảo Labtainer thì làm sao?">Lỗi kết nối Labtainer</button>
        <button type="button" class="suggestion-btn" data-query="Các bài tập có hạn nộp trong tuần này?">Hạn nộp tuần này</button>
      </div>

      <!-- Khung soạn tin nhắn -->
      <div class="chat-footer">
        <form id="chat-form" class="chat-input-row">
          <input
            id="chat-input"
            class="input"
            type="text"
            placeholder="Nhập câu hỏi của bạn... (nhấn Enter để gửi)"
            aria-label="Nội dung câu hỏi"
            autocomplete="off"
            required
          >
          <button type="submit" class="btn btn-primary" id="btn-send">
            <i data-lucide="send"></i>
            <span>Gửi</span>
          </button>
        </form>
        <div class="faint" style="font-size:11.5px;margin-top:6px;text-align:center">
          Trợ lý tự động hỗ trợ quy trình làm lab và quy chế thực hành an toàn thông tin.
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var D = window.CLX;
      var msgContainer = document.getElementById('chat-messages');
      var chatForm = document.getElementById('chat-form');
      var chatInput = document.getElementById('chat-input');
      var resetBtn = document.getElementById('btn-reset-chat');
      var resetDialog = document.getElementById('confirm-reset-dialog');
      var cancelResetBtn = document.getElementById('btn-cancel-reset');
      var confirmResetBtn = document.getElementById('btn-confirm-reset');

      // Khởi tạo danh sách tin nhắn từ CLX.chat: ánh xạ from=me thành user, bỏ câu chào và chỉ hiện thời gian nếu có nguồn dữ liệu
      function initChatLog() {
        return (D.chat || []).filter(function (m) {
          // Bỏ câu chào theo quy tắc mục 10
          return !/^Chào\b/i.test(m.text.trim());
        }).map(function (m) {
          return {
            from: m.from === 'me' ? 'user' : m.from,
            text: m.text,
            time: m.time || null
          };
        });
      }

      var chatLog = initChatLog();

      function renderMessages() {
        msgContainer.innerHTML = '';
        chatLog.forEach(function (msg) {
          var isBot = msg.from === 'bot';
          var icon = isBot ? 'message-square' : 'user-round';

          var msgEl = document.createElement('div');
          msgEl.className = 'chat-msg ' + (isBot ? 'bot' : 'user');

          var avatar = document.createElement('span');
          avatar.className = 'msg-avatar';
          var ic = document.createElement('i');
          ic.setAttribute('data-lucide', icon);
          avatar.appendChild(ic);

          var content = document.createElement('div');
          content.className = 'msg-content';

          var bubble = document.createElement('div');
          bubble.className = 'msg-bubble';
          bubble.textContent = msg.text;
          content.appendChild(bubble);

          if (msg.time) {
            var timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time mono tnum';
            timeSpan.textContent = msg.time;
            content.appendChild(timeSpan);
          }

          msgEl.appendChild(avatar);
          msgEl.appendChild(content);
          msgContainer.appendChild(msgEl);
        });

        window.clxIcons();
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      function getBotAnswer(query) {
        var q = query.toLowerCase();
        if (q.indexOf('wfn') !== -1 || q.indexOf('tên tệp') !== -1 || q.indexOf('tên file') !== -1) {
          return 'Lỗi WFN (Wrong File Name) xảy ra khi tên tệp nộp không đúng định dạng quy định. Lưu ý: Không đổi tên tệp .lab sau khi xuất từ máy ảo. Hãy nộp tệp nguyên bản do lệnh kết thúc lab sinh ra.';
        }
        if (q.indexOf('nộp') !== -1 || q.indexOf('cách nộp') !== -1 || q.indexOf('.lab') !== -1) {
          return 'Quy trình nộp bài gồm 4 bước:\n1. Mở bài lab trong máy ảo Labtainer.\n2. Hoàn thành toàn bộ yêu cầu đề bài.\n3. Chạy lệnh stoplab để đóng lab và sinh tệp .lab.\n4. Vào mục Bài tập trên CyberLabX, chọn bài tương ứng và tải tệp .lab lên để chấm tự động.';
        }
        if (q.indexOf('kết nối') !== -1 || q.indexOf('máy ảo') !== -1 || q.indexOf('labtainer') !== -1) {
          return 'Nếu gặp lỗi kết nối máy ảo: Kiểm tra lại mạng nội bộ ảo giữa máy chủ và Labtainer, khởi động lại dịch vụ Docker trên máy cá nhân, hoặc tham khảo mục Hướng dẫn cài đặt phòng lab.';
        }
        if (q.indexOf('hạn') !== -1 || q.indexOf('tuần') !== -1 || q.indexOf('deadline') !== -1) {
          var due = (D.inProgress || []).map(function (p) { return '• ' + p.title + ' (Hạn ' + p.deadline + ')'; }).join('\n');
          return 'Các bài tập sắp đến hạn của bạn:\n' + due;
        }
        return 'Hệ thống đã ghi nhận nội dung câu hỏi. Bạn có thể tham khảo mục Hướng dẫn hoặc liên hệ trợ giảng/giảng viên phụ trách để được hỗ trợ.';
      }

      function sendUserMessage(text) {
        var clean = text.trim();
        if (!clean) return;

        chatLog.push({
          from: 'user',
          text: clean
        });
        renderMessages();

        // Bot phản hồi tự động sau một thoáng
        setTimeout(function () {
          var answer = getBotAnswer(clean);
          chatLog.push({
            from: 'bot',
            text: answer
          });
          renderMessages();
        }, 350);
      }

      chatForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var val = chatInput.value;
        if (!val) return;
        chatInput.value = '';
        sendUserMessage(val);
      });

      // Nhấn Enter trong ô nhập
      chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          chatForm.requestSubmit();
        }
      });

      // Bấm vào gợi ý câu hỏi
      document.querySelectorAll('.suggestion-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var q = btn.dataset.query;
          sendUserMessage(q);
        });
      });

      // Đặt lại cuộc trò chuyện có xác nhận
      resetBtn.addEventListener('click', function () {
        if (typeof resetDialog.showModal === 'function') {
          resetDialog.showModal();
        } else {
          if (confirm('Bạn có chắc chắn muốn bắt đầu lại cuộc trò chuyện?')) {
            chatLog = initChatLog();
            renderMessages();
          }
        }
      });

      cancelResetBtn.addEventListener('click', function () {
        resetDialog.close();
        resetBtn.focus();
      });

      confirmResetBtn.addEventListener('click', function () {
        chatLog = initChatLog();
        renderMessages();
        resetDialog.close();
        resetBtn.focus();
      });

      renderMessages();
    })();
  </script>
</body>
</html>
