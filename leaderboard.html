<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng xếp hạng · CyberLabX</title>
  <link rel="stylesheet" href="assets/vendor/fonts.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/skin-quest.css">
  <script src="assets/theme.js"></script>
  <style>
    /* Riêng trang Bảng xếp hạng */
    .board-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .board-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* Top 3 một hàng gọn: thẻ phẳng 3 cột ngang, không bục vinh danh to */
    .top3-card {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
    }
    .top3-col {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
    }
    .top3-col + .top3-col {
      border-left: 1px solid var(--line);
    }
    .top3-col.is-first {
      background: var(--surface-2);
    }
    .top3-stat {
      text-align: right;
      flex: none;
      font-size: 13px;
    }
    .top3-stat b {
      display: block;
      font-weight: 500;
      color: var(--text);
    }

    /* Bảng sổ cái: cột thứ hạng .no */
    .board-tbl-class {
      --cols: 48px 90px 40px 150px minmax(0, 1.4fr) minmax(0, 1.2fr) 90px 90px;
    }
    .board-tbl-xp {
      --cols: 48px 90px 40px minmax(0, 2fr) 140px 110px;
    }
    .board-tbl.ledger .tbl-row::before {
      left: 60px;
    }
    .board-tbl .no {
      padding-right: 0;
      text-align: center;
    }

    .col-trend {
      white-space: nowrap;
    }
    .trend-up { color: var(--ok); font-size: 12px; font-weight: 500; }
    .trend-down { color: var(--err); font-size: 12px; font-weight: 500; }
    .trend-same { color: var(--text-3); font-size: 12px; }

    /* Thanh ghim thứ hạng của mình */
    .my-pinned-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .my-pinned-bar .left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 860px) {
      .top3-card {
        grid-template-columns: 1fr;
      }
      .top3-col + .top3-col {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .board-tbl-class {
        --cols: 32px 60px 32px minmax(120px, 1fr) 56px 56px;
      }
      .col-acc, .col-course {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .board-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .board-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .board-controls .segmented {
        width: 100%;
        display: flex;
      }
      .board-controls .segmented button {
        flex: 1;
        padding: 0 6px;
        font-size: 12.5px;
      }
      .board-controls .select {
        width: 100% !important;
      }
      .my-pinned-bar {
        padding: 10px 14px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .my-pinned-bar .left {
        gap: 6px;
      }
      #my-pin-acc {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .board-tbl .tbl-head {
        display: none;
      }
      .board-tbl-class {
        --cols: 28px 28px 28px minmax(0, 1fr) 52px;
        font-size: 13px;
      }
      .board-tbl-xp {
        --cols: 28px 28px 28px minmax(0, 1fr) 68px;
        font-size: 13px;
      }
      .board-tbl-class .tbl-row, .board-tbl-xp .tbl-row {
        padding: 0 14px;
        min-height: 44px;
        gap: 8px;
      }
      .board-tbl.ledger .tbl-row::before {
        left: 46px;
      }
      .col-tried, .col-level {
        display: none !important;
      }
    }
  </style>
</head>
<body data-page="leaderboard" data-title="Bảng xếp hạng">
  <main class="content" id="content">
    <div class="stack">
      <!-- Bộ điều khiển phạm vi và lớp -->
      <div class="board-header">
        <div class="board-controls">
          <div class="segmented" role="group" aria-label="Phạm vi bảng xếp hạng">
            <button id="tab-class" aria-pressed="true">Theo lớp học phần</button>
            <button id="tab-xp" aria-pressed="false">Toàn khóa (XP)</button>
          </div>
          <select class="select" id="select-class" aria-label="Chọn lớp học phần" style="width:auto">
            <option value="INT1449.01">An toàn & Bảo mật HTTT (INT1449.01)</option>
            <option value="WEB3021.01">Kiểm thử xâm nhập (WEB3021.01)</option>
            <option value="CRY2010.01">Mật mã học ứng dụng (CRY2010.01)</option>
          </select>
        </div>
      </div>

      <!-- Top 3: một hàng gọn, không bục vinh danh to -->
      <section id="top3-section">
        <div class="section-head">
          <h2>Dẫn đầu</h2>
        </div>
        <div class="card top3-card" id="top3-container"></div>
      </section>

      <!-- Bảng xếp hạng chi tiết -->
      <section>
        <div class="section-head">
          <h2>Danh sách xếp hạng</h2>
          <span class="meta tnum" id="table-meta"></span>
        </div>

        <div class="card" id="table-card">
          <!-- Thanh ghim vị trí của bạn -->
          <div class="my-pinned-bar" id="my-pinned-bar">
            <div class="left">
              <span class="chip chip-accent tnum" id="my-pin-rank">Hạng #2</span>
              <span style="font-weight:500" id="my-pin-name">Vũ Trung Đức</span>
              <span class="chip chip-accent" style="height:18px;font-size:11px;padding:0 6px">Bạn</span>
              <span class="mono faint tnum" id="my-pin-acc">B23DCAT002</span>
            </div>
            <div class="row-gap faint tnum">
              <span id="my-pin-stats">30 đúng · 36 đã thử</span>
              <span>·</span>
              <button class="link" id="btn-jump-me" style="border:0;background:none;padding:4px 6px;font-size:13px;min-height:32px;display:inline-flex;align-items:center;cursor:pointer">Đến dòng của tôi</button>
            </div>
          </div>

          <!-- Bảng sổ cái CSS Grid -->
          <div class="tbl ledger board-tbl board-tbl-class" id="board-table" role="table" aria-label="Bảng xếp hạng sinh viên">
            <div role="rowgroup">
              <div class="tbl-row tbl-head" id="table-head" role="row"></div>
            </div>
            <div id="table-rows" role="rowgroup"></div>
          </div>

          <div class="pager-host" id="board-pager"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var D = window.CLX;
      var U = window.CLXUI;
      var esc = U.esc;
      var curMode = 'class'; // 'class' hoặc 'xp'
      var curClass = 'INT1449.01';

      var tabClass = document.getElementById('tab-class');
      var tabXp = document.getElementById('tab-xp');
      var selectClass = document.getElementById('select-class');

      var classNames = {
        'INT1449.01': 'An toàn & Bảo mật HTTT',
        'WEB3021.01': 'Kiểm thử xâm nhập',
        'CRY2010.01': 'Mật mã học ứng dụng'
      };

      var state = { rows: [], page: 1, size: 20 };
      var pg = CLXUI.pager(document.getElementById('board-pager'), {
        total: 0,
        page: 1,
        size: 20,
        sizes: [10, 20, 30],
        onChange: function (page, size) {
          state.page = page;
          state.size = size;
          drawTableOnly();
        }
      });

      function getStudentList() {
        var list = (D.leaderboard || []).slice();
        if (curMode === 'xp') {
          // Xếp theo XP giảm dần
          list.sort(function (a, b) { return b.xp - a.xp; });
          list = list.map(function (item, idx) {
            var copy = Object.assign({}, item);
            copy.rank = idx + 1;
            copy.level = Math.floor(copy.xp / 200);
            return copy;
          });
        } else {
          // Lọc bản ghi theo classCode thật, không tự bịa số
          list = list.filter(function (item) {
            return item.classCode === curClass;
          });
          list.sort(function (a, b) {
            if (b.correct !== a.correct) return b.correct - a.correct;
            return a.tried - b.tried;
          });
          list = list.map(function (item, idx) {
            var copy = Object.assign({}, item);
            copy.rank = idx + 1;
            return copy;
          });
        }
        return list;
      }

      function formatTrend(trend) {
        if (trend > 0) {
          return '<span class="trend-up tnum" title="Tăng ' + trend + ' bậc">↑ ' + trend + '</span>';
        } else if (trend < 0) {
          return '<span class="trend-down tnum" title="Giảm ' + Math.abs(trend) + ' bậc">↓ ' + Math.abs(trend) + '</span>';
        }
        return '<span class="trend-same" title="Không đổi bậc">—</span>';
      }

      function renderTop3(top3) {
        var container = document.getElementById('top3-container');
        container.innerHTML = top3.map(function (p) {
          if (!p) return '';
          var isFirst = p.rank === 1;
          var statHtml = curMode === 'xp'
            ? '<b>' + p.xp.toLocaleString('en-US') + ' XP</b><span class="faint">Lv.' + (p.level || 42) + '</span>'
            : '<b>' + p.correct + ' đúng</b><span class="faint">/' + p.tried + ' thử</span>';

          var rankChip = isFirst
            ? '<span class="chip chip-accent tnum">#1</span>'
            : '<span class="chip chip-mono tnum">#' + p.rank + '</span>';

          var meChip = p.me ? '<span class="chip chip-accent" style="height:18px;font-size:11px;padding:0 6px;margin-left:4px">Bạn</span>' : '';

          return '<div class="top3-col' + (isFirst ? ' is-first' : '') + '">' +
            '<div>' + rankChip + '</div>' +
            '<span class="avatar avatar-sm">' + esc(p.initials) + '</span>' +
            '<div style="min-width:0;flex:1">' +
              '<div class="trunc" style="font-weight:500;font-size:13.5px">' + esc(p.name) + meChip + '</div>' +
              '<div class="faint trunc tnum" style="font-size:12px">' +
                esc(curMode === 'xp' ? 'Toàn khóa' : p.account) + ' · ' + formatTrend(p.trend) +
              '</div>' +
            '</div>' +
            '<div class="top3-stat tnum">' + statHtml + '</div>' +
          '</div>';
        }).join('');
      }

      var top3Section = document.getElementById('top3-section');
      var pinnedBar = document.getElementById('my-pinned-bar');
      var tbl = document.getElementById('board-table');
      var thead = document.getElementById('table-head');
      var tbody = document.getElementById('table-rows');

      function drawTableOnly() {
        var total = state.rows.length;
        var start = (state.page - 1) * state.size;
        var end = Math.min(start + state.size, total);
        var pageRows = CLXUI.paginate(state.rows, state.page, state.size);

        tbody.innerHTML = pageRows.map(function (row) {
          var meClass = row.me ? ' is-me' : '';
          var meBadge = row.me ? '<span class="chip chip-accent" style="height:18px;font-size:11px;padding:0 6px;margin-left:6px">Bạn</span>' : '';

          if (curMode === 'xp') {
            return '<div class="tbl-row' + meClass + '" role="row" id="' + (row.me ? 'row-me' : '') + '">' +
              '<span class="no tnum" role="cell">' + row.rank + '</span>' +
              '<span class="col-trend" role="cell">' + formatTrend(row.trend) + '</span>' +
              '<span class="avatar avatar-sm" role="cell">' + esc(row.initials) + '</span>' +
              '<div class="trunc" role="cell" style="font-weight:500">' + esc(row.name) + meBadge + '</div>' +
              '<span class="mono num tnum" role="cell" style="font-weight:500">' + row.xp.toLocaleString('en-US') + '</span>' +
              '<span class="mono num tnum faint col-level" role="cell">Cấp ' + (row.level || 42) + '</span>' +
            '</div>';
          }

          return '<div class="tbl-row' + meClass + '" role="row" id="' + (row.me ? 'row-me' : '') + '">' +
            '<span class="no tnum" role="cell">' + row.rank + '</span>' +
            '<span class="col-trend" role="cell">' + formatTrend(row.trend) + '</span>' +
            '<span class="avatar avatar-sm" role="cell">' + esc(row.initials) + '</span>' +
            '<span class="mono faint tnum col-acc trunc" role="cell">' + esc(row.account) + '</span>' +
            '<div class="trunc" role="cell" style="font-weight:500">' + esc(row.name) + meBadge + '</div>' +
            '<span class="dim col-course trunc" role="cell">' + esc(classNames[row.classCode] || row.classCode) + '</span>' +
            '<span class="mono num tnum" role="cell" style="font-weight:500">' + row.correct + '</span>' +
            '<span class="mono num tnum faint col-tried" role="cell">' + row.tried + '</span>' +
          '</div>';
        }).join('');

        document.getElementById('table-meta').textContent = (start + 1) + '–' + end + ' / ' + total + ' sinh viên';
        window.clxIcons();
      }

      function render() {
        var total = state.rows.length;

        // Trạng thái rỗng khi lớp học phần chưa có dữ liệu thật (không tự bịa số)
        if (total === 0) {
          if (top3Section) top3Section.style.display = 'none';
          if (pinnedBar) pinnedBar.style.display = 'none';
          thead.style.display = 'none';
          tbody.innerHTML = '<div class="empty">' +
            '<div>Chưa có dữ liệu xếp hạng cho lớp học phần này.</div>' +
            '<div class="faint" style="font-size:13px;margin-top:4px">' +
              'Dữ liệu mẫu hiện chỉ có lớp INT1449.01 (An toàn &amp; Bảo mật HTTT). Vui lòng chọn lại lớp này để xem bảng xếp hạng.' +
            '</div>' +
          '</div>';
          document.getElementById('table-meta').textContent = '0 sinh viên';
          window.clxIcons();
          return;
        }

        if (top3Section) top3Section.style.display = 'block';
        thead.style.display = 'grid';

        // Render Top 3
        var top3 = state.rows.slice(0, 3);
        renderTop3(top3);

        // Sinh viên hiện tại (is-me)
        var myItem = state.rows.filter(function (it) { return it.me; })[0];
        if (myItem) {
          pinnedBar.style.display = 'flex';
          document.getElementById('my-pin-rank').textContent = 'Hạng #' + myItem.rank;
          document.getElementById('my-pin-name').textContent = myItem.name;
          document.getElementById('my-pin-acc').textContent = curMode === 'xp' ? '' : myItem.account;
          document.getElementById('my-pin-stats').textContent = curMode === 'xp'
            ? myItem.xp.toLocaleString('en-US') + ' XP · Lv.' + (myItem.level || 42)
            : myItem.correct + ' đúng · ' + myItem.tried + ' đã thử';
        } else {
          pinnedBar.style.display = 'none';
        }

        // Tiêu đề cột theo chế độ
        if (curMode === 'xp') {
          tbl.className = 'tbl ledger board-tbl board-tbl-xp';
          thead.innerHTML =
            '<span role="columnheader" class="no">#</span>' +
            '<span role="columnheader" class="col-trend">Thay đổi</span>' +
            '<span role="columnheader"></span>' +
            '<span role="columnheader">Họ tên</span>' +
            '<span role="columnheader" class="num">XP</span>' +
            '<span role="columnheader" class="num col-level">Cấp</span>';
        } else {
          tbl.className = 'tbl ledger board-tbl board-tbl-class';
          thead.innerHTML =
            '<span role="columnheader" class="no">#</span>' +
            '<span role="columnheader" class="col-trend">Thay đổi</span>' +
            '<span role="columnheader"></span>' +
            '<span role="columnheader" class="col-acc">Tài khoản</span>' +
            '<span role="columnheader">Họ tên</span>' +
            '<span role="columnheader" class="col-course">Lớp học phần</span>' +
            '<span role="columnheader" class="num">Đúng</span>' +
            '<span role="columnheader" class="num col-tried">Đã thử</span>';
        }

        drawTableOnly();
      }

      function updateData() {
        state.rows = getStudentList();
        state.page = 1;
        pg.set({ total: state.rows.length, page: 1 });
        render();
      }

      // Đổi chế độ xếp hạng
      tabClass.addEventListener('click', function () {
        if (curMode === 'class') return;
        curMode = 'class';
        tabClass.setAttribute('aria-pressed', 'true');
        tabXp.setAttribute('aria-pressed', 'false');
        selectClass.style.display = 'inline-block';
        updateData();
      });

      tabXp.addEventListener('click', function () {
        if (curMode === 'xp') return;
        curMode = 'xp';
        tabXp.setAttribute('aria-pressed', 'true');
        tabClass.setAttribute('aria-pressed', 'false');
        selectClass.style.display = 'none';
        updateData();
      });

      // Đổi lớp học phần
      selectClass.addEventListener('change', function (e) {
        curClass = e.target.value;
        updateData();
      });

      // Nhảy tới dòng của tôi
      document.getElementById('btn-jump-me').addEventListener('click', function () {
        var myIdx = -1;
        for (var i = 0; i < state.rows.length; i++) {
          if (state.rows[i].me) { myIdx = i; break; }
        }
        if (myIdx >= 0) {
          var targetPage = Math.floor(myIdx / state.size) + 1;
          state.page = targetPage;
          pg.set({ page: targetPage });
          drawTableOnly();
          var rowMe = document.getElementById('row-me');
          if (rowMe) {
            rowMe.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      });

      updateData();
    })();
  </script>
</body>
</html>
